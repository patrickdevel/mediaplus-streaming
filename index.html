<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Media + – Gerät wählen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M14 7h4v7h7v4h-7v7h-4v-7H7v-4h7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fff;--bg-2:#fafafa;--bg-3:#f2f2f2;
  --fg:#000;--fg-2:#333;--fg-3:#666;--fg-4:#999;
  --border:#eaeaea;--border-2:#d4d4d4;
  --accent:#0070f3;--accent-fg:#fff;
  --r:8px;--r-sm:6px;--r-lg:12px;
  --hh:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000;--bg-2:#0a0a0a;--bg-3:#161616;
  --fg:#fff;--fg-2:#ccc;--fg-3:#888;--fg-4:#666;
  --border:#1f1f1f;--border-2:#333;
  --accent:#3291ff;--accent-fg:#fff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--fg-2);transition:background .12s,color .12s}
.icon-btn:hover{background:var(--bg-3);color:var(--fg)}

/* Header */
.top{height:var(--hh);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.015em;margin-right:auto}
.logo .mark{width:28px;height:28px;border-radius:var(--r-sm);background:var(--fg);color:var(--bg);display:grid;place-items:center}
.logo small{font-weight:500;color:var(--fg);font-size:15px;margin-left:2px}

/* Main */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 60px;max-width:720px;width:100%;margin:0 auto}
h1{font-size:24px;line-height:1.2;letter-spacing:-.025em;font-weight:600;margin:0 0 8px;text-align:center}
.lead{color:var(--fg-3);font-size:14px;text-align:center;margin:0 0 32px;max-width:44ch}

/* Choices */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.choice{display:flex;flex-direction:column;padding:20px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);transition:border-color .12s,background .12s;min-height:170px}
.choice:hover{border-color:var(--border-2);background:var(--bg-2)}
.choice .icon-wrap{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);margin-bottom:16px;transition:border-color .12s,background .12s}
.choice:hover .icon-wrap{border-color:var(--border-2);background:var(--bg-3)}
.choice .icon-wrap svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.choice h2{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.choice p{font-size:12.5px;color:var(--fg-3);margin:0;line-height:1.5}
.choice .go{margin-top:auto;padding-top:16px;font-size:12.5px;font-weight:500;color:var(--fg-3);display:inline-flex;align-items:center;gap:4px;transition:color .12s}
.choice:hover .go{color:var(--fg)}
.choice .go svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
.choice:hover .go svg{transform:translateX(2px)}

.hint{margin-top:20px;font-size:12.5px;color:var(--fg-4);text-align:center;min-height:18px}
.hint b{color:var(--fg-2);font-weight:500}

/* Debug-Link */
.debug-link{
  display:inline-block;
  margin-top:8px;
  font-size:13px;
  color:var(--accent);
  text-decoration:underline;
  text-underline-offset:2px;
  text-decoration-thickness:1px;
}
.debug-link:hover{text-decoration-thickness:2px}

/* Footer */
footer{padding:20px;text-align:center;font-size:12px;color:var(--fg-4);border-top:1px solid var(--border)}

@media(max-width:600px){
  .top{padding:0 16px}
  main{padding:28px 16px 40px}
  h1{font-size:20px}
  .choices{grid-template-columns:1fr;gap:10px}
  .choice{min-height:0;padding:18px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2"/><path d="m17 2-5 5-5-5"/></symbol>
  <symbol id="i-devices" viewBox="0 0 24 24"><rect x="2" y="4" width="13" height="9.5" rx="1.6"/><path d="M5 17.5h5M7.5 13.5v4"/><rect x="16.5" y="9.5" width="5.5" height="10.5" rx="1.6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<header class="top">
  <a class="logo" href="./" aria-label="Startseite">
    <span class="mark" id="logoMark"></span>
    <span>Media<small>+</small></span>
  </a>
  <button class="icon-btn" id="theme" aria-label="Design wechseln"></button>
</header>

<main>
  <h1>Auf welchem Gerät schaust du?</h1>
  <p class="lead">Wähle dein Gerät aus, damit die Oberfläche zu deinem Bildschirm passt.</p>

  <div class="choices">
    <a class="choice" href="tv.html" data-device="tv">
      <span class="icon-wrap"><svg aria-hidden="true"><use href="#i-tv"/></svg></span>
      <h2>Fernseher</h2>
      <p>Smart-TV, Streaming-Box oder Konsole</p>
      <span class="go">Weiter <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></span>
    </a>
    <a class="choice" href="mobile.html" data-device="mobile">
      <span class="icon-wrap"><svg aria-hidden="true"><use href="#i-devices"/></svg></span>
      <h2>Mobil &amp; Desktop</h2>
      <p>Handy, Tablet, Laptop oder PC</p>
      <span class="go">Weiter <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrow"/></svg></span>
    </a>
  </div>

  <!-- NEU: Debug-Link unter den Karten -->
  <a class="debug-link" href="https://mediaplus-streaming.vercel.app/debug.html">Debug Menü</a>

  <p class="hint" id="hint" role="status" aria-live="polite"></p>
</main>

<footer>
  Inoffizielles Projekt · nicht mit der ARD verbunden
</footer>

<script>
'use strict';

const store = {
  get(k, d) { try { const v = localStorage.getItem('mt:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mt:' + k, JSON.stringify(v)); } catch {} }
};

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.getElementById('theme').innerHTML =
    `<svg class="ic" aria-hidden="true"><use href="#i-${t === 'dark' ? 'sun' : 'moon'}"/></svg>`;
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = t === 'dark' ? '#000000' : '#ffffff';
}

function detectTV() {
  const ua = navigator.userAgent || '';
  const tvUA = /(smart-?tv|smarttv|hbbtv|netcast|web0s|webos|tizen|bravia|viera|aquos|googletv|appletv|crkey|firetv|aft[a-z]\b|roku|vidaa|playstation|xbox|nintendo switch)/i;
  if (tvUA.test(ua)) return true;
  if (/iPad|Tablet|PlayBook|Silk|Android(?!.*Mobile)/i.test(ua)) return false;
  const noHover = matchMedia('(hover: none)').matches && matchMedia('(pointer: coarse)').matches;
  return window.innerWidth >= 1280 && noHover;
}

// Init
document.getElementById('logoMark').innerHTML =
  '<svg class="ic fill" style="width:16px;height:16px" aria-hidden="true"><use href="#i-plus"/></svg>';
setTheme(store.get('theme', 'dark'));

document.getElementById('theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', t);
  setTheme(t);
});

// Auswahl merken
document.querySelectorAll('.choice').forEach(a => {
  a.addEventListener('click', () => store.set('device', a.dataset.device));
});

// Hinweis
document.getElementById('hint').innerHTML = detectTV()
  ? 'Sieht nach einem <b>Fernseher</b> aus.'
  : 'Sieht nach <b>Mobil oder Desktop</b> aus.';

// Tastatur: 1 = TV, 2 = Mobil
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === '1') location.href = 'tv.html';
  if (k === '2') location.href = 'mobile.html';
});
</script>
</body>
</html>
