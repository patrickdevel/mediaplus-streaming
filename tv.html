<style>
/* Gleicher Hintergrund wie die Einstellungen: Live-TV, Suche, Abos, Shorts, Verlauf, Gemerkt */
#setbg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .45s ease;overflow:hidden;
 background:radial-gradient(60% 70% at 15% 20%,#8fdcff 0,transparent 60%),radial-gradient(55% 60% at 85% 15%,#7fb2ff 0,transparent 60%),radial-gradient(60% 70% at 30% 95%,#7fc9c9 0,transparent 60%),linear-gradient(160deg,#76c8ff,#9ec4dc 55%,#6fb3c4)}
:root[data-theme="dark"] #setbg{background:radial-gradient(60% 70% at 15% 20%,#16324a 0,transparent 60%),radial-gradient(55% 60% at 85% 15%,#1b2a5a 0,transparent 60%),radial-gradient(60% 70% at 30% 95%,#0f3b3b 0,transparent 60%),linear-gradient(160deg,#0b1118,#0e141c 55%,#0a1216)}
#setbg i{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(9vw);opacity:.6;animation:sDrift 16s ease-in-out infinite alternate}
#setbg i:first-child{background:#7fd6ff;left:-18vw;top:-24vw}
#setbg i:last-child{background:#7d9dff;right:-22vw;bottom:-30vw;animation-duration:22s;animation-delay:-7s}
:root[data-theme="dark"] #setbg i:first-child{background:#1c6aa0;opacity:.28}
:root[data-theme="dark"] #setbg i:last-child{background:#2c3fa8;opacity:.28}
body[data-route="live"] #setbg,body[data-route="suche"] #setbg,body[data-route="subs"] #setbg,body[data-route="shorts"] #setbg,body[data-route="library"] #setbg{opacity:1}
body[data-route="live"],body[data-route="suche"],body[data-route="subs"],body[data-route="shorts"],body[data-route="library"]{background:transparent!important}
/* Intro-Choreografie nach dem Boot: erst nur das Karussell, dann kommen Dock (unten) und Uhr + Drei-Punkte (oben) rein */
.acc.top{z-index:260}
html.bi,html.bi body{overflow:hidden}
html.bi body.home .hclock,html.bi body.home .hmore{opacity:0!important;transform:translateY(-6rem)!important;pointer-events:none!important}
html.bi body.home .hfirst .happs{opacity:0!important;transform:translateY(calc(100% + 7rem))!important;pointer-events:none!important}
html.bi body.home .hero .hin,html.bi body.home .hero .hdots,html.bi body.home .hglass{opacity:0!important;pointer-events:none!important}
html.br body.home .hclock,html.br body.home .hmore{transition:opacity .7s ease .15s,transform .95s cubic-bezier(.2,.8,.2,1) .15s!important}
html.br body.home .hfirst .happs{transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .6s ease!important}
html.br body.home .hero .hin{transition:opacity .9s ease .7s,transform .3s,padding-bottom .6s cubic-bezier(.2,.8,.2,1)!important}
html.br body.home .hero .hdots,html.br body.home .hglass{transition:opacity .9s ease .7s!important}
#boot{position:fixed;inset:0;z-index:99999;background:#000;opacity:1;transition:opacity 1.1s ease;cursor:none;touch-action:none}
#boot.out{opacity:0;pointer-events:none}
#boot canvas{position:absolute;inset:0;width:100%;height:100%}

<div id="boot" aria-hidden="true"><canvas id="bootcv"></canvas></div>
<script>
(function(){
  var root=document.documentElement;root.classList.add('bi');
  var el=document.getElementById('boot'),cv=document.getElementById('bootcv'),ctx=cv.getContext('2d');
  var B=window.BOOT={active:true,skip:function(){finish();}};
  var ANIM=11.6,MAXD=15,done=false,started=false,raf=0,t0=0;
  var au=new Audio('startup.mp3');au.preload='auto';
  function play(){if(started&&!done)au.play().catch(function(){});}
  function size(){var d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);}
  size();addEventListener('resize',size);
  function cl(x){return Math.max(0,Math.min(1,x));}
  function lerp(a,b,t){return a+(b-a)*t;}
  function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
  function eoq(x){return 1-Math.pow(1-x,4);}
  /* echte Konturlänge je Buchstabe messen (Dash startet pro Teilpfad neu, daher längster Teilpfad) */
  var PER={};
  function measure(ch,fs){
    var key=ch+fs;if(PER[key])return PER[key];
    var r=1100;
    try{
      var c=document.createElement('canvas');c.width=340;c.height=300;
      var x=c.getContext('2d');x.font='700 '+fs+'px '+FONT;x.textBaseline='middle';x.lineWidth=1;x.lineCap='butt';x.lineJoin='miter';x.strokeStyle='#fff';
      function cnt(L){x.clearRect(0,0,340,300);x.setLineDash(L?[L,9999]:[]);x.strokeText(ch,40,150);var d=x.getImageData(0,0,340,300).data,n=0;for(var i=3;i<d.length;i+=4)if(d[i]>20)n++;return n;}
      var full=cnt(0),lo=1,hi=4000;
      for(var i=0;i<14;i++){var m=(lo+hi)/2;if(cnt(m)>=full*.997)hi=m;else lo=m;}
      r=hi*1.03;
    }catch(e){}
    return PER[key]=r;
  }
  /* Graue Verlaufs-Kontur */
  var GRAY=['#f4f4f6','#9b9ba5','#5a5a64','#d2d2d8'];
  var FONT='"Space Grotesk","Inter","Helvetica Neue",Arial,sans-serif';
  function frame(s){
    var t=s/6.5;
    var W=cv.width,H=cv.height,bw=1280,bh=720,k=Math.min(W/bw,H/bh);
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.setTransform(k,0,0,k,(W-bw*k)/2,(H-bh*k)/2);
    ctx.save();ctx.beginPath();ctx.rect(0,0,bw,bh);ctx.clip();
    var text='Media+',fs=156;
    ctx.font='700 '+fs+'px '+FONT;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineCap='round';
    var letters=text.split(''),sp=-3;
    var widths=letters.map(function(c){return ctx.measureText(c).width;});
    var total=widths.reduce(function(a,b){return a+b;},0)+sp*(letters.length-1);
    var startX=(bw-total)/2,cy=bh/2,cx=startX;
    var lay=letters.map(function(c,i){var o={ch:c,x:cx,w:widths[i],cx:cx+widths[i]/2};cx+=widths[i]+sp;return o;});
    var n=lay.length,last=n-1;
    var dp=eio(cl((t-.06)/.66));
    var zo=eio(cl((t-.66)/.24));
    var zoom=lerp(3.55,1,zo);
    var meX=lay[0].x+lay[0].w*.75,endX=lay[last].cx;
    var camX=lerp(lerp(meX,endX,dp),bw/2,zo);
    ctx.translate(bw/2,bh/2);ctx.scale(zoom,zoom);ctx.translate(-camX,-cy);
    var wa=eoq(cl((t-.72)/.18));
    /* Finale: bunter Schimmer beim Rauszoomen, dann "Media" weg, "+" gleitet in die Mitte */
    var ha=eio(cl((s-4.3)/1.4))*(1-eio(cl((s-6.9)/.9)));
    var mo=eio(cl((s-6.3)/.7));
    var ps=eio(cl((s-6.5)/1.1));
    var pm=ctx.measureText('+'),pvx=lay[last].x+(pm.actualBoundingBoxRight-pm.actualBoundingBoxLeft)/2,pvy=cy-(pm.actualBoundingBoxAscent-pm.actualBoundingBoxDescent)/2;
    var plusShift=(bw/2-pvx)*ps;
    /* Finale: "+" bleibt kurz stehen, wächst dann riesig bis der Bildschirm weiß ist */
    var bs=Math.exp(Math.log(80)*eio(cl((s-9.4)/2)));
    var wh=cl((s-10.9)/.5);
    if(bs>1.0001){ctx.translate(bw/2,pvy);ctx.scale(bs,bs);ctx.translate(-bw/2,-pvy);}
    function ox(i){return i===last?plusShift:0;}
    function am(i){return i===last?1:1-mo;}
    var g=ctx.createLinearGradient(startX-20,cy-60,startX+total+20,cy+60);
    g.addColorStop(0,GRAY[0]);g.addColorStop(.35,GRAY[1]);g.addColorStop(.7,GRAY[2]);g.addColorStop(1,GRAY[3]);
    if(ha>.003){
      var sc=k*zoom,D=4000;
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.shadowOffsetX=D*sc;ctx.shadowBlur=Math.min(40*sc,80);
      lay.forEach(function(it,i){
        var a=ha*am(i)*.75;if(a<.003)return;
        var hue=(190+(i/(n-1))*170+s*40)%360,col='hsl('+hue.toFixed(0)+',90%,60%)';
        ctx.globalAlpha=a;ctx.fillStyle=col;ctx.shadowColor=col;
        ctx.fillText(it.ch,it.x+ox(i)-D,cy);
      });
      ctx.restore();
    }
    if(wa>.001){
      ctx.save();ctx.fillStyle='#fff';
      ctx.shadowColor='rgba(255,255,255,.35)';ctx.shadowBlur=24*wa;
      lay.forEach(function(it,i){
        var a=wa*am(i);if(a<.003)return;
        ctx.globalAlpha=a;ctx.fillText(it.ch,it.x+ox(i),cy);
      });
      ctx.restore();
    }
    var sa=1-wa*.92;
    if(bs<1.5&&dp>.0001&&sa>.01&&(mo<.999||ps<1)){
      ctx.save();ctx.strokeStyle=g;ctx.lineWidth=3.2;
      ctx.shadowColor='#a1a1aa';ctx.shadowBlur=18;
      var span=1/n;
      lay.forEach(function(it,i){
        var a=sa*am(i);if(a<.01)return;
        var lp=cl((dp-i*span*.85)/(span*1.35));
        if(lp>0){
          ctx.save();ctx.translate(ox(i),0);ctx.globalAlpha=a;
          if(lp>=1){ctx.setLineDash([]);}else{ctx.setLineDash([measure(it.ch,fs)*eio(lp),9999]);}
          ctx.lineDashOffset=0;
          ctx.strokeText(it.ch,it.x,cy);
          ctx.lineWidth=1.4;ctx.strokeStyle='#fff';ctx.globalAlpha=a*.55;ctx.strokeText(it.ch,it.x,cy);
          ctx.restore();
        }
      });
      ctx.restore();
    }
    ctx.restore();
    if(wh>0){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=wh;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  }
  function loop(now){
    if(done)return;
    var s=(now-t0)/1000;
    frame(Math.min(s,ANIM));
    var ad=au.duration,end=(isFinite(ad)&&ad>0)?Math.min(MAXD,Math.max(ANIM+.3,Math.min(ad,ANIM+1.5))):ANIM+.3;
    if(s>=end)return finish();
    raf=requestAnimationFrame(loop);
  }
  function go(){
    if(started||done)return;started=true;
    'Media+'.split('').forEach(function(c){measure(c,156);});t0=performance.now();play();raf=requestAnimationFrame(loop);
  }
  /* Schrift erst laden, damit die Kontur sauber zeichnet (max. 1,5 s warten) */
  frame(0);
  var fp=(document.fonts&&document.fonts.load)?Promise.race([document.fonts.load('700 156px "Space Grotesk"'),new Promise(function(r){setTimeout(r,1500);})]):Promise.resolve();
  fp.then(go,go);
  function reveal(){root.classList.add('br');root.classList.remove('bi');setTimeout(function(){root.classList.remove('br');},2400);}
  function tryReveal(n){
    if(document.body.classList.contains('home')&&!document.querySelector('.hero .hslide')&&n<30)return setTimeout(function(){tryReveal(n+1);},200);
    reveal();
  }
  function finish(){
    if(done)return;done=true;cancelAnimationFrame(raf);
    el.classList.add('out');
    var v=au.volume,n=0,fade=setInterval(function(){n++;au.volume=Math.max(0,v*(1-n/9));if(n>=9){clearInterval(fade);au.pause();}},100);
    setTimeout(function(){B.active=false;el.remove();removeEventListener('resize',size);},1200);
    /* sofort beim Überblenden: Dock + Uhr + Drei-Punkte einfahren */
    setTimeout(function(){tryReveal(0);},300);
  }
  /* während des Starts: keine Bedienung am TV */
  ['keydown','keyup','keypress','click','dblclick','pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','wheel','contextmenu'].forEach(function(ev){
    window.addEventListener(ev,function(e){
      if(!B.active)return;
      if(ev==='keydown'||ev==='pointerdown'||ev==='click')play();
      e.preventDefault();e.stopImmediatePropagation();
    },true);
  });
})();
</script>
