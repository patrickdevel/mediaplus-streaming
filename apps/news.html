<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>News</title>
<style>
:root{
  --bg:#000;
  --bg-subtle:#0a0a0a;
  --bg-hover:#111;
  --border:#333;
  --border-hover:#555;
  --fg:#ededed;
  --fg-muted:#888;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(10px,min(1.15vw,2.04vh),48px);background:var(--bg);scrollbar-width:none}
html,html *{cursor:none!important}
::-webkit-scrollbar{display:none}
body{
  height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);
  font:400 1rem/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;touch-action:none;overscroll-behavior:none
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit}
:focus{outline:none}

#app{display:flex;flex-direction:column;height:100vh;padding:2rem 3rem 0}

/* ---------- Kopf (Vercel Style) ---------- */
header{
  display:flex;align-items:center;gap:2rem;flex:none;
  padding-bottom:1.5rem;border-bottom:1px solid var(--border);margin-bottom:2rem
}
.brand{display:flex;align-items:center;gap:1.2rem}
.logo{
  background:#fff;color:#000;border-radius:6px;
  padding:.4rem 1rem .5rem;font-size:1.6rem;font-weight:700;letter-spacing:-.04em;line-height:1;
}
.appname{font-size:1rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.hclock{margin-left:auto;font-size:1.1rem;font-weight:400;color:var(--fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Layout ---------- */
main{flex:1;min-height:0;display:flex;gap:2rem}
#side{width:20rem;flex:none;display:flex;flex-direction:column;gap:.4rem;overflow-y:auto;padding:0 .5rem 3rem 0}
#content{flex:1;min-width:0;overflow-y:auto;padding:0 1rem 4rem 1rem;scroll-behavior:smooth}

/* ---------- Fokus (Vercel Outline) ---------- */
.res:focus, .card:focus, .btn:focus, [data-f]:focus {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
  border-radius: 8px;
  z-index: 10;
  position: relative;
}

/* ---------- Seitenleiste ---------- */
.side-head{font-size:.85rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-muted);padding:.5rem 1.2rem}
.res{
  display:flex;align-items:center;gap:1rem;height:3.5rem;padding:0 1.2rem;
  border-radius:8px;background:transparent;border:1px solid transparent;
  font-size:1.1rem;font-weight:500;color:var(--fg-muted);flex:none;
  transition:background .15s, color .15s, border-color .15s;
}
.res:hover{background:var(--bg-subtle)}
.res.act{background:var(--bg-hover);color:var(--fg);border-color:var(--border)}
.side-gap{flex:1;min-height:1rem}

/* ---------- Liste ---------- */
.list-head{display:flex;align-items:baseline;gap:1.2rem;margin:.2rem 0 1.5rem;flex-wrap:wrap}
.list-head h2{font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.list-head .hint{font-size:.95rem;color:var(--fg-muted)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:stretch}
.card{
  display:flex;flex-direction:column;background:var(--bg-subtle);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
  transition:background .15s, border-color .15s;
}
.card:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.card:focus{background:var(--bg-hover);border-color:var(--border-hover)}
.card .thumb{height:9rem;flex:none;overflow:hidden;background:#000;border-bottom:1px solid var(--border)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.card-body{padding:1.2rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.kicker{font-size:.8rem;font-weight:400;color:var(--fg-muted);text-transform:lowercase;letter-spacing:0}
.card h3{font-size:1.15rem;line-height:1.35;font-weight:500;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:.95rem;line-height:1.5;color:var(--fg-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Artikel ---------- */
.abar{display:flex;gap:1rem;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap}
.btn{
  height:3.2rem;padding:0 1.4rem;border-radius:6px;border:1px solid var(--border);
  background:var(--bg-subtle);font-size:1rem;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  transition:background .15s, border-color .15s;
}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn.pri{background:#fff;color:#000;border-color:#fff}
.btn.pri:hover{background:#e0e0e0;border-color:#e0e0e0}

.article{max-width:52rem;margin:0 auto;padding-bottom:3rem}
.article h1{font-size:2rem;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin:1rem 0 1rem}
.article .meta{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.9rem;color:var(--fg-muted);margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1rem}
.article .hero{width:100%;max-height:24rem;object-fit:cover;border-radius:8px;margin-bottom:1.5rem;display:block;background:#000;border:1px solid var(--border)}
.article p{font-size:1.1rem;line-height:1.6;color:#ccc;margin-bottom:1rem}
.article p.lead{font-size:1.25rem;line-height:1.5;color:var(--fg);font-weight:500}

/* ---------- Status ---------- */
.msg{text-align:center;color:var(--fg-muted);font-size:1.1rem;padding:4rem 2rem}
.msg-sub{font-size:.95rem;color:var(--fg-muted);margin-top:.5rem}
.spinner{width:2.5rem;height:2.5rem;margin:0 auto 1.5rem;border-radius:50%;border:2px solid var(--border);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:3rem;transform:translate(-50%,2rem);z-index:60;padding:1rem 2rem;border-radius:8px;background:#fff;color:#000;font-size:1rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== TV-Stil (wie Einstellungen / Apps): Aqua-Verlauf, weiche weiße Pills, Fokus = weiß + größer ===== */
html{background:#76c8ff}
body{background:radial-gradient(60% 70% at 15% 20%,#8fdcff 0,transparent 60%),radial-gradient(55% 60% at 85% 15%,#7fb2ff 0,transparent 60%),radial-gradient(60% 70% at 30% 95%,#7fc9c9 0,transparent 60%),linear-gradient(160deg,#76c8ff,#9ec4dc 55%,#6fb3c4)!important;background-attachment:fixed;color:#111!important}

:root{--bg:transparent;--bg-subtle:rgba(255,255,255,.32);--bg-hover:#fff;--border:transparent;--border-hover:transparent;--fg:#111;--fg-muted:rgba(0,0,0,.5);color-scheme:light}
header{border-bottom:0}
.logo{background:rgba(70,100,100,.62);color:rgba(230,242,238,.95);border-radius:1.6rem;padding:.7rem 1.6rem .8rem}
.appname{color:#3b78c2;font-weight:700}
.list-head h2{color:#3b78c2;font-size:2.2rem}
html .res{border-radius:99px;height:4.4rem;background:rgba(255,255,255,.32);color:#111;border:0;transition:transform .15s,background .15s,box-shadow .15s}
html .res.act{background:rgba(255,255,255,.62)}
html .res:focus,html .card:focus,html .btn:focus,html [data-f]:focus{outline:0;background:#fff;transform:scale(1.04);box-shadow:0 1.2rem 3rem rgba(0,0,0,.22);border-color:transparent}
html .res:focus{border-radius:99px}
html .card:focus{border-radius:2.4rem}
html .btn:focus{border-radius:99px}
.card{border:0;border-radius:2.4rem;background:rgba(255,255,255,.32);transition:transform .15s,background .15s,box-shadow .15s}
.card .thumb{border-bottom:0;background:rgba(0,0,0,.08)}
.card h3{color:#111}.card p{color:rgba(0,0,0,.55)}
.btn{border:0;border-radius:99px;background:rgba(255,255,255,.32);color:#111;height:4rem;padding:0 2rem}
.btn.pri,.btn.pri:hover{background:#3b78c2;color:#fff}
html .btn.pri:focus{background:#fff;color:#111}
.article h1{color:#111}.article p{color:#222}.article p.lead{color:#111}
.article .hero{border:0;border-radius:2.4rem}
.article .meta{border-bottom-color:rgba(0,0,0,.15)}
.spinner{border-color:rgba(0,0,0,.15);border-top-color:#3b78c2}
#toast{border-radius:99px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo">News</div>
      <div class="appname">tagesschau</div>
    </div>
    <div class="hclock" id="hclock"></div>
  </header>
  <main>
    <aside id="side"></aside>
    <section id="content"></section>
  </main>
</div>
<div id="toast"></div>
<script>
(() => {
'use strict';

/* ============================================================
   Helfer
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); };
const p2 = n => String(n).padStart(2, '0');
const cut = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + ' …' : s;

/* ============================================================
   Datenquellen
   ============================================================ */
const FEEDS = [
  { id:'start',        name:'Startseite',  url:'https://www.tagesschau.de/xml/rss2/' },
  { id:'inland',       name:'Inland',      url:'https://www.tagesschau.de/inland/index~rss2.xml' },
  { id:'ausland',      name:'Ausland',     url:'https://www.tagesschau.de/ausland/index~rss2.xml' },
  { id:'wirtschaft',   name:'Wirtschaft',  url:'https://www.tagesschau.de/wirtschaft/index~rss2.xml' },
  { id:'wissen',       name:'Wissen',      url:'https://www.tagesschau.de/wissen/index~rss2.xml' },
  { id:'investigativ', name:'Investigativ',url:'https://www.tagesschau.de/investigativ/index~rss2.xml' },
  { id:'kultur',       name:'Kultur',      url:'https://www.tagesschau.de/kultur/index~rss2.xml' },
  { id:'sport',        name:'Sport',       url:'https://www.sportschau.de/index~rss2.xml' }
];

const S = { feed:'start', items:{}, status:{}, article:null, lastCard:0, last:null, col:null, colFor:null };

/* ============================================================
   Netzwerk (mit CORS-Fallback-Kette)
   ============================================================ */
const PROXIES = [
  u => u,
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?' + encodeURIComponent(u)
];
async function fetchText(url) {
  for (const p of PROXIES) {
    try {
      const r = await fetch(p(url), { cache:'no-store', credentials:'omit' });
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.length > 120) return t;
    } catch (e) { /* nächster Proxy */ }
  }
  throw new Error('net');
}
async function fetchJina(url) {
  try {
    const r = await fetch('https://r.jina.ai/' + url, { cache:'no-store' });
    if (!r.ok) return '';
    const t = await r.text();
    if (!t || t.length < 250) return '';
    if (/^(401|Authentication|Unauthorized)/i.test(t.slice(0, 60))) return '';
    return t;
  } catch (e) { return ''; }
}

/* ============================================================
   RSS / Artikel parsen
   ============================================================ */
function xmlText(el, sel) { const n = el.querySelector(sel); return n ? (n.textContent || '').trim() : ''; }
function stripHtml(s) { const d = document.createElement('div'); d.innerHTML = s; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }

function parseRss(x) {
  const doc = new DOMParser().parseFromString(x, 'application/xml');
  if (doc.querySelector('parsererror')) return [];
  return Array.from(doc.querySelectorAll('item')).map(it => {
    const raw = xmlText(it, 'description');
    let img = '';
    const enc = it.querySelector('enclosure');
    if (enc && /image/i.test(enc.getAttribute('type') || '')) img = enc.getAttribute('url') || '';
    if (!img) { try { const mc = it.getElementsByTagName('media:content')[0]; if (mc) img = mc.getAttribute('url') || ''; } catch (e) {} }
    if (!img) { const m = /<img[^>]+src="([^"]+)"/i.exec(raw); if (m) img = m[1]; }
    return { title: xmlText(it, 'title'), desc: stripHtml(raw), link: xmlText(it, 'link'), date: xmlText(it, 'pubDate'), img: img };
  }).filter(x => x.title && x.link);
}

function extractParagraphs(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const scope = doc.querySelector('.storytext') || doc.querySelector('article') || doc.querySelector('main') || doc.body;
  if (!scope) return [];
  let ps = Array.from(scope.querySelectorAll('p'))
    .map(p => (p.textContent || '').replace(/\s+/g, ' ').trim())
    .filter(t => t.length > 55);
  const seen = {};
  ps = ps.filter(t => { const k = t.slice(0, 80); if (seen[k]) return false; seen[k] = 1; return true; });
  if (ps.join(' ').length < 250) return [];
  return ps;
}

function mdToParas(md) {
  if (!md) return [];
  const out = [];
  for (let l of md.split('\n')) {
    l = l.trim();
    if (!l) continue;
    l = l.replace(/!\[[^\]]*\]\([^)]*\)/g, '')
         .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
         .replace(/[*_`#>|]/g, '').trim();
    if (l.length > 55 && !/^(Zum|Mehr|Weitere|Alle|Bild|Video|Quelle|Anzeige|Cookies)/i.test(l)) out.push(l);
  }
  return out.slice(0, 60);
}

function fmtDate(s) {
  const d = new Date(s);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) + ' Uhr';
}

/* ============================================================
   Laden
   ============================================================ */
async function loadFeed(id, force) {
  const f = FEEDS.filter(x => x.id === id)[0];
  if (!f) return;
  if (S.status[id] === 'loading') return;
  if (S.items[id] && S.items[id].length && !force) return;
  S.status[id] = 'loading';
  if (S.feed === id && !S.article) render();
  try {
    const txt = await fetchText(f.url);
    const items = parseRss(txt);
    if (!items.length) throw new Error('leer');
    S.items[id] = items.slice(0, 30);
    S.status[id] = 'ready';
  } catch (e) {
    S.status[id] = 'error';
    if (!S.items[id]) S.items[id] = [];
  }
  if (S.feed === id && !S.article) render();
}

async function loadArticleBody(it) {
  let paras = [];
  try { paras = extractParagraphs(await fetchText(it.link)); } catch (e) {}
  if (!paras.length) { try { paras = mdToParas(await fetchJina(it.link)); } catch (e) {} }
  if (!S.article || S.article.item !== it) return;
  S.article.paras = paras;
  S.article.status = paras.length ? 'ready' : 'empty';
  render();
}

/* ============================================================
   Rendern
   ============================================================ */
function loadingBox(txt) {
  return h('div', { class:'msg' }, h('div', { class:'spinner' }), h('div', {}, txt));
}

function card(it, i) {
  return h('button', { class:'card', 'data-f':true, type:'button', 'data-key':'a' + i, onclick:() => openArticle(it, i) },
    it.img ? h('div', { class:'thumb' },
      h('img', { src:it.img, alt:'', loading:'lazy', onerror:e => { const p = e.target.parentNode; if (p) p.remove(); } })) : null,
    h('div', { class:'card-body' },
      h('span', { class:'kicker' }, 'tagesschau'),
      h('h3', {}, it.title),
      it.desc ? h('p', {}, cut(it.desc, 165)) : null));
}

function buildList() {
  const st = S.status[S.feed] || 'idle';
  const items = S.items[S.feed] || [];
  const fName = FEEDS.filter(x => x.id === S.feed)[0]?.name || 'Startseite';
  
  const head = h('div', { class:'list-head' },
    h('h2', {}, fName),
    h('span', { class:'hint' }, st === 'loading' ? 'Lädt …' : (st === 'error' ? 'Nicht erreichbar' : items.length + ' Meldungen')));

  if (!items.length) {
    if (st === 'loading' || st === 'idle') return h('div', {}, head, loadingBox('Nachrichten werden geladen …'));
    return h('div', {}, head,
      h('div', { class:'msg' },
        h('div', {}, 'Feed konnte nicht geladen werden.'),
        h('div', { class:'msg-sub' }, 'Bitte Internetverbindung prüfen.'),
        h('div', { style:'margin-top:1.5rem' },
          h('button', { class:'btn pri', 'data-f':true, type:'button', 'data-key':'retry', onclick:() => loadFeed(S.feed, true) }, 'Erneut versuchen'))));
  }
  return h('div', {}, head, h('div', { class:'list' }, items.map((it, i) => card(it, i))));
}

function buildArticle() {
  const a = S.article, it = a.item;
  const bar = h('div', { class:'abar' },
    h('button', { class:'btn', 'data-f':true, type:'button', 'data-key':'back', onclick:closeArticle }, '‹ Zurück'),
    h('button', { class:'btn', 'data-f':true, type:'button', 'data-key':'reload-art', onclick:() => openArticle(it, S.lastCard) }, '↻ Neu laden'));

  const kids = [
    h('span', { class:'kicker' }, 'tagesschau'),
    h('h1', {}, it.title),
    h('div', { class:'meta' }, fmtDate(it.date) || '')
  ];
  if (it.img) kids.push(h('img', { class:'hero', src:it.img, alt:'', onerror:e => e.target.remove() }));

  if (a.status === 'loading') {
    kids.push(loadingBox('Artikel wird geladen …'));
  } else if (a.paras && a.paras.length) {
    a.paras.forEach((t, i) => kids.push(h('p', { class: i === 0 ? 'lead' : '' }, t)));
  } else {
    kids.push(h('p', { class:'lead' }, it.desc || 'Für diesen Beitrag ist kein Text verfügbar.'));
    kids.push(h('div', { class:'msg-sub', style:'text-align:left;margin-top:1rem' }, 'Tipp: Mit „Neu laden“ erneut versuchen.'));
  }

  // Wichtig: kein data-f, damit kein hässlicher Fokus-Rahmen um den Text erscheint
  return h('div', {},
    bar,
    h('div', { class:'article', tabindex:'-1', 'data-key':'art' }, kids));
}

function buildContent() {
  return S.article ? buildArticle() : buildList();
}

function renderSide() {
  $('#side').replaceChildren(
    h('div', { class:'side-head' }, 'Ressorts'),
    ...FEEDS.map(f => h('button', {
      class: 'res' + (f.id === S.feed ? ' act' : ''), 'data-f':true, 'data-key':'res-' + f.id, type:'button',
      onclick:() => setFeed(f.id)
    }, f.name)),
    h('div', { class:'side-gap' }),
    h('button', { class:'res', 'data-f':true, 'data-key':'reload', type:'button', onclick:() => { toast('Wird aktualisiert …'); loadFeed(S.feed, true); } }, '↻ Aktualisieren')
  );
}

function render() {
  const c = $('#content');
  const a = document.activeElement;
  const key = (a && a.dataset && a.dataset.key) ? a.dataset.key : null;
  const sc = c.scrollTop;
  c.replaceChildren(buildContent());
  c.scrollTop = sc;
  if (key) {
    const n = c.querySelector('[data-key="' + key + '"]');
    if (n) n.focus({ preventScroll:true });
  }
}

/* ============================================================
   Aktionen
   ============================================================ */
function setFeed(id) {
  S.feed = id; S.article = null;
  renderSide(); render();
  $('#content').scrollTop = 0;
  focusEl($('#side .res[data-key="res-' + id + '"]'));
  loadFeed(id);
}

function openArticle(it, idx) {
  S.lastCard = (typeof idx === 'number') ? idx : 0;
  S.article = { item: it, status:'loading', paras: [] };
  render();
  $('#content').scrollTop = 0;
  focusEl($('[data-key="art"]'), false);
  loadArticleBody(it);
}

function closeArticle() {
  S.article = null;
  render();
  const n = $('#content').querySelector('[data-key="a' + S.lastCard + '"]');
  focusEl(n || $('#content .card') || initial());
}

/* ============================================================
   Uhr im Kopf
   ============================================================ */
function tickClock() {
  const d = new Date(), el = $('#hclock');
  if (!el) return;
  el.textContent = d.toLocaleDateString('de-DE', { weekday:'short', day:'2-digit', month:'2-digit' }) +
                   '   ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
}
setInterval(tickClock, 1000);
tickClock();

/* ============================================================
   TV-Fernbedienung / Navigation
   ============================================================ */
const initial = () => $('#side .res.act') || $('#side .res');

function vis(el) {
  if (el.disabled || el.hidden) return false;
  const r = el.getBoundingClientRect();
  if (r.width < 4 || r.height < 4 || r.right <= 0 || r.left >= innerWidth) return false;
  const sc = el.closest('#content');
  if (sc) { const b = sc.getBoundingClientRect(); if (r.bottom <= b.top || r.top >= b.bottom) return false; }
  return true;
}

function focusEl(el, scroll) {
  if (!el) return;
  el.focus({ preventScroll:true });
  if (scroll !== false && el.closest('#content')) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function move(dir) {
  let cur = document.activeElement;
  if (!cur || !cur.matches || !cur.matches('[data-f]')) cur = null;
  if (!cur) return focusEl(S.last && S.last.isConnected && vis(S.last) ? S.last : initial());

  const all = $$('[data-f]').filter(e => e !== cur && vis(e));
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  const hz = dir === 'left' || dir === 'right';
  if (hz || S.colFor !== cur) S.col = null;
  if (!hz && S.col == null) S.col = cx;
  const colX = S.col == null ? cx : S.col;

  let best = null, bs = Infinity;
  for (const strict of [true, false]) {
    for (const el of all) {
      const r = el.getBoundingClientRect(), ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      let prim, gap, off;
      if (hz) {
        if (dir === 'right' ? ex <= cx + 1 : ex >= cx - 1) continue;
        prim = dir === 'right' ? r.left - c.right : c.left - r.right;
        gap = Math.max(0, r.top - c.bottom, c.top - r.bottom);
        if (strict && gap > 8) continue;
        off = Math.abs(ey - cy);
      } else {
        if (dir === 'down' ? ey <= cy + 1 : ey >= cy - 1) continue;
        prim = dir === 'down' ? r.top - c.bottom : c.top - r.bottom;
        gap = Math.max(0, r.left - c.right, c.left - r.right);
        off = Math.abs(ex - colX);
      }
      const sc = Math.max(0, prim) + gap * 3 + off * .5 + (!hz && gap > 0 ? 1000 : 0);
      if (sc < bs) { bs = sc; best = el; }
    }
    if (best) break;
  }
  if (best) { S.colFor = best; focusEl(best); }
}

function goBack() {
  if (S.article) { closeArticle(); return true; }
  const a = document.activeElement;
  if (a && a.matches && a.matches('[data-f]')) {
    const ini = initial();
    if (a !== ini) { focusEl(ini); return true; }
    return false;
  }
  return false;
}

/* Tasten vom TV-Fenster (Eltern-Seite) entgegennehmen */
window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d || d.type !== 'mp-key') return;
  if (d.key === 'Enter' || d.keyCode === 13 || d.key === ' ') {
    const a = document.activeElement;
    if (a && a !== document.body && a.click) { a.click(); return; }
  }
  document.dispatchEvent(new KeyboardEvent('keydown', { key:d.key, keyCode:d.keyCode, which:d.keyCode, bubbles:true, cancelable:true }));
});

document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key, c = ev.keyCode;

  if (k === 'Enter' || c === 13 || k === ' ') { const a = document.activeElement; if (a && a !== document.body && a.matches && a.matches('button,[data-f],[tabindex],a[href],input,select,[role=button]') && a.click) { ev.preventDefault(); a.click(); return; } }

  if (k === 'GoBack' || k === 'BrowserBack' || c === 461 || c === 10009 || k === 'Escape' || k === 'Backspace') {
    if (goBack()) ev.preventDefault();
    else { try { parent.postMessage({ type:'mp-app-exit' }, '*'); } catch (e) {} }
    return;
  }

  const dir = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' }[k] ||
              ({ 37:'left', 38:'up', 39:'right', 40:'down' })[c];
  if (!dir) return;
  ev.preventDefault();

  /* Im Artikel: hoch/runter scrollen statt Fokus bewegen */
  if (S.article && (dir === 'up' || dir === 'down')) {
    const a = document.activeElement;
    const inSide = a && a.closest && a.closest('#side');
    
    // Wenn der Fokus in der Seitenleiste liegt, normale Navigation zulassen
    if (!inSide) {
      const cont = $('#content');
      const onBar = a && a.dataset && (a.dataset.key === 'back' || a.dataset.key === 'reload-art');
      
      if (dir === 'down') {
        if (onBar) focusEl($('[data-key="art"]'), false);
        cont.scrollTop += cont.clientHeight * .5;
      } else {
        if (cont.scrollTop <= 2) {
          if (!onBar) focusEl($('[data-key="back"]'), false);
        } else {
          cont.scrollTop -= cont.clientHeight * .5;
        }
      }
      return;
    }
    // Wenn inSide -> normale Navigation (fällt durch zu move(dir))
  }

  move(dir);
});

document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('[data-f]')) S.last = e.target; });

/* Touch/Gesten blocken (TV) */
const kill = ev => { if (ev.cancelable) ev.preventDefault(); ev.stopImmediatePropagation(); };
['touchstart','touchmove','touchend','touchcancel','gesturestart'].forEach(t => document.addEventListener(t, kill, { capture:true, passive:false }));
['contextmenu','dragstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

/* Vollbild beim ersten Tastendruck */
(() => {
  const w = () => {
    ['pointerdown','keydown','click'].forEach(t => document.removeEventListener(t, w, true));
    try {
      const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn && !document.fullscreenElement) Promise.resolve(fn.call(el)).catch(() => {});
    } catch (e) {}
  };
  ['pointerdown','keydown','click'].forEach(t => document.addEventListener(t, w, true));
})();

/* ============================================================
   Start
   ============================================================ */
renderSide();
render();
focusEl(initial());
loadFeed('start');
})();
/* Systemtasten (Lautstärke, Sprachsuche, Einstellungen, Menü) NICHT abfangen; Tastatursuche -> Host */
(() => {
  const SYS = /^(AudioVolume(Up|Down|Mute)|Volume(Up|Down|Mute)|VoiceAssist|LaunchAssistant|Assistant|VoiceDial|Settings|Menu|ContextMenu|Info|Help)$/;
  const SYSC = [173,174,175,447,448,449,231,93,82,457];
  ['keydown','keyup','keypress'].forEach(t => window.addEventListener(t, ev => {
    if (SYS.test(ev.key) || SYSC.includes(ev.keyCode)) { ev.stopImmediatePropagation(); return; }
    if (t === 'keydown' && (ev.key === 'BrowserSearch' || ev.key === 'Search' || ev.keyCode === 170)) { ev.preventDefault(); ev.stopImmediatePropagation(); try { parent.postMessage({ type:'mp-app-search' }, '*'); } catch {} }
  }, true));
})();
</script>
