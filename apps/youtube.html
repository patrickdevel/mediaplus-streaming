<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
:root{--bg:#0f0f0f;--s1:#272727;--s2:#3f3f3f;--tx:#f1f1f1;--tx2:#aaa;--red:#f00;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(10px,min(1.15vw,2.04vh),48px);background:var(--bg);scrollbar-width:none}
::-webkit-scrollbar{display:none}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--tx);font:500 1rem/1.4 Roboto,"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit}
:focus{outline:none}
svg{fill:currentColor}

/* Navigationsleiste links (wie YouTube auf dem TV: Icons, bei Fokus mit Beschriftung) */
#nav{position:fixed;left:0;top:0;bottom:0;width:9.4rem;padding:2.4rem 1.4rem;display:flex;flex-direction:column;gap:.6rem;z-index:10;overflow:hidden;background:linear-gradient(90deg,var(--bg) 75%,transparent);transition:width .18s}
#nav:focus-within{width:26rem;background:linear-gradient(90deg,rgba(15,15,15,.98) 82%,transparent)}
.logo{display:flex;align-items:center;gap:.8rem;height:4.6rem;margin:0 0 2.2rem .9rem;flex:none;white-space:nowrap}
.logo svg{width:4.2rem;height:3rem;flex:none}
.logo b{font-size:2.5rem;font-weight:700;letter-spacing:-.06em;opacity:0;transition:opacity .15s}
#nav:focus-within .logo b{opacity:1}
.nv{height:5.6rem;flex:none;border-radius:99px;display:flex;align-items:center;gap:2rem;padding:0 1.5rem;font-size:1.5rem;white-space:nowrap;transition:background .12s,color .12s}
.nv svg{width:2.8rem;height:2.8rem;flex:none}
.nv span{opacity:0}
#nav:focus-within .nv span{opacity:1}
.nv.active{background:rgba(255,255,255,.12)}
.nv:focus{background:#fff;color:var(--bg)}
.nv.end{margin-top:auto}

#content{position:absolute;left:9.4rem;right:0;top:0;bottom:0;overflow-y:auto;padding:3rem 4rem 4rem 3rem}
h2{font-size:2.1rem;font-weight:500;margin:0 0 .2rem 1.2rem}
section{margin-bottom:1.4rem}

/* Kacheln */
.shelf{display:flex;gap:1.6rem;overflow-x:auto;padding:1.4rem 1.2rem 1.6rem;scroll-padding:0 3rem}
.card{flex:none;width:31rem;border-radius:1.4rem;transition:transform .14s;display:block}
.card:focus{transform:scale(1.06);position:relative;z-index:4}
.th{position:relative;aspect-ratio:16/9;border-radius:1.2rem;overflow:hidden;background:var(--s1)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.card:focus .th{box-shadow:0 0 0 .3rem #fff,0 1rem 2.6rem rgba(0,0,0,.6)}
.b{position:absolute;right:.6rem;bottom:.6rem;background:rgba(0,0,0,.82);border-radius:.4rem;padding:.1rem .6rem;font-size:1.15rem;font-style:normal;font-weight:600}
.b.live{background:var(--red)}
.ti{font-size:1.45rem;font-weight:500;line-height:1.35;margin-top:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.me{font-size:1.2rem;color:var(--tx2);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .th{animation:pu 1.2s ease-in-out infinite alternate}
@keyframes pu{to{background:var(--s2)}}
.msg{color:var(--tx2);font-size:1.5rem;padding:3rem 1.2rem;line-height:1.6;max-width:62rem}
.msg .btn{margin-top:2rem}

/* Listenansicht (Suche, Verlauf) */
.res .card{display:flex;gap:1.6rem;width:100%;padding:.8rem;border-radius:1.4rem}
.res .card .th{width:15.5rem;flex:none}
.res .card .tx{min-width:0;flex:1;padding-top:.2rem}
.res .card .ti{margin-top:0}
.res .card:focus{transform:scale(1.02);background:var(--s1)}
.res .card:focus .th{box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(29rem,1fr));gap:1.6rem;padding:1.4rem 1.2rem}
.grid .card{width:auto}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(28rem,1fr));gap:1.2rem;padding:1.2rem}
.channel{display:flex;align-items:center;gap:1.2rem;min-height:9rem;padding:1.2rem 1.4rem;border-radius:1.2rem;background:var(--s1);text-align:left;transition:transform .14s,background .14s}
.channel:focus{background:#fff;color:var(--bg);transform:scale(1.03)}
.channel img{width:6rem;height:6rem;border-radius:50%;object-fit:cover;background:var(--s2)}
.channel b{display:block;font-size:1.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel span{display:block;color:var(--tx2);font-size:1.2rem;margin-top:.35rem}.channel:focus span{color:#555}

/* Suche + Tastatur */
.sg{display:grid;grid-template-columns:38rem 1fr;gap:3rem;height:calc(100vh - 7rem)}
.res{overflow-y:auto;padding:.4rem .6rem 3rem;display:flex;flex-direction:column;gap:.4rem}
.qb{height:5.4rem;border-radius:99px;background:var(--s1);padding:0 2.4rem;font-size:2rem;display:flex;align-items:center;margin-bottom:1.4rem;white-space:nowrap;overflow:hidden}
.qb .ph{color:var(--tx2)}
.caret{width:.2rem;height:2.4rem;background:#fff;margin-left:.2rem;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:.5rem}
.key{height:4.4rem;border-radius:1rem;background:var(--s1);font-size:1.7rem;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.key:focus{background:#fff;color:var(--bg);transform:scale(1.1);position:relative;z-index:3}
.w2{grid-column:span 2}.w4{grid-column:span 4}
.key.go{background:var(--red)}
.key.go:focus{background:#fff;color:var(--bg)}

/* Buttons / Einstellungen */
.btn{height:4.6rem;padding:0 2.6rem;border-radius:99px;background:var(--s1);font-size:1.4rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.btn:focus{background:#fff;color:var(--bg);transform:scale(1.07)}
.btn.pri{background:var(--red)}.btn.pri:focus{background:#fff}
.set{max-width:78rem;margin:0 auto;padding-top:1rem}
.set h1{font-size:2.8rem;font-weight:500;margin-bottom:.6rem}
.set p{color:var(--tx2);font-size:1.3rem;margin-bottom:2rem;line-height:1.6}
.row{display:flex;gap:1.2rem;margin-top:1.6rem}

#toast{position:fixed;left:50%;bottom:3.6rem;transform:translate(-50%,2rem);z-index:60;padding:1.2rem 2.4rem;border-radius:999px;background:var(--tx);color:var(--bg);font-size:1.3rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Home: Chips + Grid */
.chips{display:flex;gap:1rem;padding:.4rem 1.2rem 1rem;overflow-x:auto}
.chip{flex:none;height:4rem;padding:0 1.8rem;border-radius:1rem;background:rgba(255,255,255,.1);font-size:1.4rem;font-weight:500;transition:background .12s}
.chip:hover{background:rgba(255,255,255,.2)}
.chip.on{background:#f1f1f1;color:#0f0f0f}
.chip:focus{background:#fff;color:#000;box-shadow:0 0 0 .3rem rgba(255,255,255,.45)}
.grid{grid-template-columns:repeat(auto-fill,minmax(32rem,1fr));gap:2.4rem 1.6rem}
.card:hover .th{filter:brightness(1.08)}
.ti{font-size:1.5rem;font-weight:600}
/* Suche YouTube-Stil */
.res .card .th{width:27rem}
.res .card .ti{font-size:1.75rem;font-weight:500;-webkit-line-clamp:2}
.res .card .me{font-size:1.25rem;margin-top:.5rem}
.res h2{margin:1rem 0 .4rem 1rem}
.channels{display:flex;flex-direction:column;gap:.2rem;padding:.4rem 0}
.channel{background:none;min-height:0;padding:1.2rem 1.6rem;gap:2.6rem;border-radius:1.4rem}
.channel img{width:11rem;height:11rem;flex:none}
.channel b{font-size:1.8rem;white-space:normal}
.channel span{font-size:1.25rem;white-space:normal}
.channel .cd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.5rem}
.channel:hover,.channel:focus{background:var(--s1);color:inherit;transform:none}
.channel:focus span{color:var(--tx2)}
.chhead{display:flex;gap:3rem;align-items:center;padding:1rem 1.2rem}
.chhead img{width:15rem;height:15rem;border-radius:50%;object-fit:cover;background:var(--s1)}
.chhead h1{font-size:3.4rem;font-weight:700}.chhead p{margin:.6rem 0 1.4rem;max-width:80rem}
/* Player */
#pl{position:fixed;inset:0;background:#000;z-index:40;display:none;overflow:hidden}
#pl.show{display:block}
#fr{width:100%;height:100%;border:0;pointer-events:none;display:block}
#pclick{position:absolute;inset:0}
#pui{position:absolute;inset:0;opacity:0;transition:opacity .2s;pointer-events:none}
#pui.show{opacity:1}
#pui.show #ptop,#pui.show #pbot{pointer-events:auto}
#ptop{position:absolute;top:0;left:0;right:0;padding:1.6rem 2.4rem 8rem;background:linear-gradient(rgba(0,0,0,.8),transparent);display:flex;gap:1.4rem;align-items:flex-start}
#pt b{display:block;font-size:2.2rem;font-weight:500;line-height:1.3;margin-top:.7rem}
#pt span{color:#ccc;font-size:1.4rem}
#pbot{position:absolute;bottom:0;left:0;right:0;padding:9rem 2.4rem 1.4rem;background:linear-gradient(transparent,rgba(0,0,0,.85))}
#seek{height:2.4rem;display:flex;align-items:center;cursor:pointer;margin:0 .8rem;border-radius:1rem}
.trk{position:relative;width:100%;height:.45rem;background:rgba(255,255,255,.3);border-radius:9px;transition:height .1s}
#seek:hover .trk,#seek:focus .trk,#seek.drag .trk{height:.8rem}
#pbuf,#pg{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px}
#pbuf{background:rgba(255,255,255,.4)}#pg{background:#f00}
#knob{position:absolute;top:50%;left:0;width:1.8rem;height:1.8rem;margin:-.9rem 0 0 -.9rem;border-radius:50%;background:#f00;transform:scale(0);transition:transform .1s}
#seek:hover #knob,#seek:focus #knob,#seek.drag #knob{transform:scale(1)}
#prow{display:flex;align-items:center;gap:.3rem;margin-top:.2rem}
.pbtn{min-width:5.2rem;height:5.2rem;border-radius:99px;display:flex;align-items:center;justify-content:center;position:relative;flex:none;padding:0 .8rem;font-size:1.5rem;font-weight:600;color:#fff;transition:background .1s}
.pbtn svg{width:3.4rem;height:3.4rem}
.pbtn:hover{background:rgba(255,255,255,.15)}
.pbtn:focus{background:#fff;color:#000}
.pbtn .n{position:absolute;font-size:.95rem;font-weight:700;top:50%;left:50%;transform:translate(-50%,-30%)}
.pbtn.on::after{content:'';position:absolute;bottom:.5rem;left:28%;right:28%;height:.3rem;background:#f00;border-radius:2px}
#ptm{font-size:1.45rem;margin-left:1.2rem;font-variant-numeric:tabular-nums;color:#eee;white-space:nowrap}
#ptm i{font-style:normal;color:#aaa}
.sp{flex:1}
#pcen{position:absolute;left:50%;top:50%;width:11rem;height:11rem;margin:-5.5rem;border-radius:50%;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;pointer-events:none}
#pcen svg{width:6.4rem;height:6.4rem;color:#fff}
#pl.paused #pcen{display:flex}
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="content" class="sc"></div>
<div id="pl"><iframe id="fr" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1"></iframe>
  <div id="pclick"></div><div id="pcen"></div>
  <div id="pui">
    <div id="ptop"><button id="pback" class="pbtn" type="button" data-f="true" aria-label="Zurück"></button><div id="pt"></div></div>
    <div id="pbot">
      <div id="seek" tabindex="0" data-f="true"><div class="trk"><div id="pbuf"></div><div id="pg"></div><b id="knob"></b></div></div>
      <div id="prow">
        <button id="pplay" class="pbtn" type="button" data-f="true" aria-label="Wiedergabe"></button>
        <button id="pprev" class="pbtn" type="button" data-f="true" aria-label="10 Sekunden zurück"></button>
        <button id="pnext" class="pbtn" type="button" data-f="true" aria-label="10 Sekunden vor"></button>
        <button id="pvol" class="pbtn" type="button" data-f="true" aria-label="Ton"></button>
        <div id="ptm"><span id="p1">0:00</span> <i>/</i> <span id="p2">0:00</span></div>
        <div class="sp"></div>
        <button id="pspd" class="pbtn" type="button" data-f="true" aria-label="Geschwindigkeit">1×</button>
        <button id="pcapt" class="pbtn" type="button" data-f="true" aria-label="Untertitel"></button>
        <button id="pfs" class="pbtn" type="button" data-f="true" aria-label="Vollbild"></button>
      </div>
    </div>
  </div></div>
<div id="toast"></div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }

}
const store = { get(k, d) { try { const v = localStorage.getItem('yt:' + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('yt:' + k, JSON.stringify(v)); } catch {} } };
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); };
const S = { tab:'home', last:null, col:null, colFor:null, tok:0, q:'', draft:'', tgt:null, playing:null };
const PL = { cur:0, dur:0, st:-1, hide:0, captions:false };
const cache = new Map();

/* ===== Icons / Logo ===== */
const ICO = {
  search:'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',
  hist:'M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z',
  set:'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z'
};
const svg = (d, vb = '0 0 24 24') => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', vb); const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.append(p); return s; };
function logo() {
  const s = svg('M27.97 3.12a3.5 3.5 0 00-2.47-2.47C23.3 0 14.5 0 14.5 0S5.7 0 3.5.65A3.5 3.5 0 001.03 3.12C.38 5.32.38 10 .38 10s0 4.68.65 6.88a3.5 3.5 0 002.47 2.47C5.7 20 14.5 20 14.5 20s8.8 0 11-.65a3.5 3.5 0 002.47-2.47c.65-2.2.65-6.88.65-6.88s0-4.68-.65-6.88z', '0 0 28.4 20');

  return h('div', { class:'logo' }, s, h('b', {}, 'YouTube'));
}
const NAV = [['search', 'Suche'], ['home', 'Start'], ['hist', 'Verlauf']];
$('#nav').append(logo(), ...NAV.map(([t, l]) => h('button', { class:'nv' + '', type:'button', 'data-f':true, 'data-tab':t, onclick:() => setTab(t) }, svg(ICO[t]), h('span', {}, l))));

/* ===== Formatierung ===== */
const U = { detik:['Sekunde','Sekunden'], menit:['Minute','Minuten'], jam:['Stunde','Stunden'], hari:['Tag','Tagen'], minggu:['Woche','Wochen'], bulan:['Monat','Monaten'], tahun:['Jahr','Jahren'], second:['Sekunde','Sekunden'], minute:['Minute','Minuten'], hour:['Stunde','Stunden'], day:['Tag','Tagen'], week:['Woche','Wochen'], month:['Monat','Monaten'], year:['Jahr','Jahren'] };
const ago = s => { const m = /(\d+)\s*(detik|menit|jam|hari|minggu|bulan|tahun|second|minute|hour|day|week|month|year)/i.exec(s || ''); return m ? 'vor ' + m[1] + ' ' + U[m[2].toLowerCase()][+m[1] !== 1 ? 1 : 0] : (s || ''); };
const nf = (n, d) => n.toFixed(d).replace('.', ',').replace(/,0$/, '');
const views = n => n == null ? '' : (n >= 1e6 ? nf(n / 1e6, n >= 1e7 ? 0 : 1) + ' Mio.' : n >= 1e3 ? nf(n / 1e3, n >= 1e4 ? 0 : 1) + ' Tsd.' : n) + ' Aufrufe';
const p2 = n => String(n).padStart(2, '0');
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (hh ? hh + ':' + p2(m) : m) + ':' + p2(s % 60); };

/* ===== API ===== */
async function api(q) {
  if (cache.has(q)) return cache.get(q);
  const r = await fetch(q.startsWith('ch:') ? '/api/yt?channel=' + encodeURIComponent(q.slice(3)) : '/api/yt?q=' + encodeURIComponent(q), { headers:{ 'x-key':sessionStorage.getItem('key') || '' } });
  if (!r.ok) throw new Error('http' + r.status);
  const data = await r.json();
  const a = { videos:(data.result || []).filter(v => v.videoId && v.title), channels:(data.channels || []).filter(v => v.channelId && (v.channelName || v.handle)) };

}
const slim = v => ({ videoId:v.videoId, title:v.title, author:{ name:v.author && v.author.name }, views:{ count:v.views && v.views.count }, publishedTime:v.publishedTime, duration:{ raw:v.duration && v.duration.raw }, isLive:v.isLive });
const card = v => h('button', { class:'card', type:'button', 'data-f':true, onclick:() => play(v) },
  h('div', { class:'th' }, h('img', { src:'https://i.ytimg.com/vi/' + v.videoId + '/hqdefault.jpg', alt:'', loading:'lazy' }), v.isLive ? h('i', { class:'b live' }, 'LIVE') : v.duration && v.duration.raw ? h('i', { class:'b' }, v.duration.raw) : null),
  h('div', { class:'tx' }, h('div', { class:'ti' }, v.title), h('div', { class:'me' }, [v.author && v.author.name, views(v.views && v.views.count), ago(v.publishedTime)].filter(Boolean).join(' • '))));
const channelCard = c => h('button', { class:'channel', type:'button', 'data-f':true, onclick:() => openChannel(c) },
  h('img', { src:c.avatar || '', alt:'' }), h('div', { style:'min-width:0' }, h('b', {}, c.channelName || c.handle || 'Kanal'), h('span', {}, [c.handle, c.subs].filter(Boolean).join(' • ') || 'Kanal'), c.description ? h('span', { class:'cd' }, c.description) : null));
const apiErr = e => h('div', { class:'msg' }, e.message === 'http401' ? 'Falscher Zugriffscode.' : 'YouTube lässt sich gerade nicht laden. Bitte später erneut versuchen.', h('br'), h('button', { class:'btn pri', type:'button', 'data-f':true, onclick:() => setTab('home') }, 'Erneut versuchen'));

/* ===== Tastatur ===== */
const CH = 'abcdefghijklmnopqrstuvwxyzäöüß1234567890-.:/_@?=';
function kb(get, set, go, label) {
  const g = h('div', { class:'kb' });
