<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
:root{
  --bg:#0f0f0f;--bg-elev:#181818;
  --s1:#212121;--s2:#272727;--s3:#383838;
  --tx:#f1f1f1;--tx2:#aaa;--tx3:#717171;
  --red:#f00;--ring:#fff;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(10px,min(1.15vw,2.04vh),48px);background:var(--bg);scrollbar-width:none}
::-webkit-scrollbar{display:none}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--tx);
  font:500 1rem/1.45 Roboto,"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit}
:focus{outline:none}
svg{fill:currentColor}

/* ============ SIDEBAR (YouTube TV) ============ */
#nav{position:fixed;left:0;top:0;bottom:0;width:9.6rem;padding:2.4rem 1.2rem;
  display:flex;flex-direction:column;gap:.5rem;z-index:20;overflow:hidden;
  background:var(--bg);transition:width .22s cubic-bezier(.4,0,.2,1),box-shadow .22s,background .22s}
#nav:focus-within{width:27rem;background:var(--bg-elev);box-shadow:1rem 0 4rem rgba(0,0,0,.55)}
.logo{display:flex;align-items:center;gap:1rem;height:5rem;margin:0 0 2.4rem .6rem;flex:none;white-space:nowrap}
.logo svg{width:4.6rem;height:3.2rem;flex:none;filter:drop-shadow(0 0 .6rem rgba(255,0,0,.35))}
.logo b{font-size:2.6rem;font-weight:700;letter-spacing:-.06em;opacity:0;transition:opacity .18s .05s}
#nav:focus-within .logo b{opacity:1}
.nv{height:6rem;flex:none;border-radius:1.2rem;display:flex;align-items:center;gap:2rem;
  padding:0 1.6rem;font-size:1.55rem;font-weight:500;white-space:nowrap;
  color:var(--tx2);transition:background .14s,color .14s}
.nv svg{width:2.8rem;height:2.8rem;flex:none}
.nv span{opacity:0;transition:opacity .15s}
#nav:focus-within .nv span{opacity:1}
.nv.active{background:rgba(255,255,255,.09);color:var(--tx)}
.nv.active svg{color:var(--red)}
.nv:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.nv:focus{background:var(--ring);color:var(--bg);box-shadow:0 .4rem 1.6rem rgba(255,255,255,.25)}
.nv:focus svg{color:var(--bg)}
.nv.end{margin-top:auto}

/* ============ CONTENT ============ */
#content{position:absolute;left:9.6rem;right:0;top:0;bottom:0;overflow-y:auto;
  padding:3.2rem 4rem 4.4rem 3.6rem}
h2{font-size:2.4rem;font-weight:600;margin:0 0 1rem 1.6rem;letter-spacing:-.01em}
section{margin-bottom:2rem}

/* ============ CHIPS ============ */
.chips{display:flex;gap:1.2rem;padding:.6rem 1.6rem 2rem;overflow-x:auto}
.chip{flex:none;height:4.4rem;padding:0 2.2rem;border-radius:1.2rem;
  background:var(--s2);font-size:1.5rem;font-weight:500;color:var(--tx);
  transition:background .14s,color .14s,transform .14s}
.chip:hover{background:var(--s3)}
.chip.on{background:#f1f1f1;color:#0f0f0f}
.chip:focus{background:var(--ring);color:var(--bg);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.35),0 .8rem 2rem rgba(0,0,0,.6);
  transform:scale(1.06)}

/* ============ KARTEN ============ */
.shelf{display:flex;gap:2rem;overflow-x:auto;padding:1.6rem 1.6rem 2rem}
.card{flex:none;width:33rem;border-radius:1.6rem;transition:transform .16s cubic-bezier(.4,0,.2,1);display:block;padding:0;color:inherit}
.card:focus{transform:scale(1.05);position:relative;z-index:4}
.th{position:relative;aspect-ratio:16/9;border-radius:1.6rem;overflow:hidden;background:var(--s2);
  transition:box-shadow .16s,filter .16s}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .th{filter:brightness(1.1)}
.card:focus .th{box-shadow:0 0 0 .45rem var(--ring),0 1.6rem 4rem rgba(0,0,0,.75)}
.b{position:absolute;right:.8rem;bottom:.8rem;background:rgba(0,0,0,.85);
  border-radius:.5rem;padding:.2rem .8rem;font-size:1.2rem;font-style:normal;font-weight:700;
  letter-spacing:.02em;backdrop-filter:blur(6px)}
.b.live{background:var(--red);letter-spacing:.06em}
.ti{font-size:1.65rem;font-weight:600;line-height:1.4;margin-top:1.2rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  letter-spacing:-.005em}
.me{font-size:1.3rem;color:var(--tx2);margin-top:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .th{animation:pu 1.2s ease-in-out infinite alternate}
@keyframes pu{to{background:var(--s3)}}
.msg{color:var(--tx2);font-size:1.6rem;padding:3.2rem 1.6rem;line-height:1.7;max-width:64rem}
.msg .btn{margin-top:2.2rem}

/* ============ GRID (Start / Kanal / Verlauf: fest 3 pro Reihe) ============ */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:3rem 2rem;padding:1.6rem 1.6rem 2rem}
.grid .card{width:auto}

/* ============ LISTE / SUCHE ERGEBNISSE ============ */
.res .card{display:flex;gap:2rem;width:100%;padding:1rem;border-radius:1.6rem}
.res .card .th{width:27rem;flex:none;border-radius:1.2rem}
.res .card .tx{min-width:0;flex:1;padding-top:.2rem;padding-right:.8rem}
.res .card .ti{margin-top:0;font-size:1.85rem;font-weight:500;-webkit-line-clamp:2}
.res .card .me{font-size:1.35rem;margin-top:.7rem}
.res .card:focus{transform:scale(1.015);background:var(--s2);box-shadow:0 0 0 .3rem var(--ring)}
.res .card:focus .th{box-shadow:none}
.res h2{margin:1.4rem 0 .8rem 1.4rem}

/* ============ KANÄLE (Suche) ============ */
.channels{display:flex;flex-direction:column;gap:.4rem;padding:.6rem 0}
.channel{display:flex;align-items:center;gap:3rem;
  padding:1.4rem 2rem;border-radius:1.6rem;background:transparent;text-align:left;
  transition:background .14s,transform .14s}
.channel:hover{background:var(--s1)}
.channel:focus{background:var(--ring);color:var(--bg);transform:scale(1.015);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.35),0 1.2rem 3rem rgba(0,0,0,.6)}
.channel img{width:11.5rem;height:11.5rem;border-radius:50%;object-fit:cover;background:var(--s2);flex:none}
.channel b{display:block;font-size:1.9rem;font-weight:600;white-space:normal;letter-spacing:-.01em}
.channel span{display:block;color:var(--tx2);font-size:1.3rem;margin-top:.5rem;white-space:normal}
.channel:focus span{color:#555}
.channel .cd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.7rem}

/* ============ KANAL-HEADER ============ */
.chhead{display:flex;gap:3.4rem;align-items:center;padding:2rem 1.6rem}
.chhead img{width:16rem;height:16rem;border-radius:50%;object-fit:cover;background:var(--s1);
  box-shadow:0 1rem 3rem rgba(0,0,0,.5)}
.chhead h1{font-size:3.8rem;font-weight:700;letter-spacing:-.02em}
.chhead p{margin:.8rem 0 1.6rem;max-width:82rem}
.chback{display:inline-flex;align-items:center;gap:.9rem;height:4.8rem;
  padding:0 2rem 0 1.4rem;border-radius:99px;background:var(--s2);
  font-size:1.45rem;font-weight:600;transition:background .14s,transform .14s,box-shadow .14s}
.chback svg{width:2.6rem;height:2.6rem}
.chback:hover{background:var(--s3)}
.chback:focus{background:var(--ring);color:var(--bg);transform:scale(1.06);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.3),0 1rem 2.4rem rgba(0,0,0,.6)}

/* ============ SUCHE + KEYBOARD (links schmaler, rechts breiter) ============ */
.sg{display:grid;grid-template-columns:32rem 1fr;gap:2.6rem;height:calc(100vh - 7.6rem)}
.res{overflow-y:auto;padding:.6rem 1rem 3.6rem;display:flex;flex-direction:column;gap:.6rem}
.qb{height:6rem;border-radius:99px;background:var(--s1);padding:0 2.6rem;
  font-size:2.1rem;display:flex;align-items:center;margin-bottom:1.8rem;
  white-space:nowrap;overflow:hidden;font-weight:500}
.qb .ph{color:var(--tx2)}
.caret{width:.2rem;height:2.6rem;background:#fff;margin-left:.2rem;animation:bl 1s steps(1) infinite;border-radius:2px}
@keyframes bl{50%{opacity:0}}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:.6rem}
.key{height:4.8rem;border-radius:1.1rem;background:var(--s2);
  font-size:1.8rem;font-weight:500;display:flex;align-items:center;justify-content:center;
  transition:transform .13s,background .13s,box-shadow .13s}
.key:hover{background:var(--s3)}
.key:focus{background:var(--ring);color:var(--bg);transform:scale(1.08);position:relative;z-index:3;
  box-shadow:0 0 0 .3rem rgba(255,255,255,.3),0 .8rem 2rem rgba(0,0,0,.5)}
.w2{grid-column:span 2}.w4{grid-column:span 4}
.key.go{background:var(--red)}
.key.go:focus{background:var(--ring);color:var(--bg)}

/* ============ BUTTONS ============ */
.btn{height:5rem;padding:0 3rem;border-radius:99px;background:var(--s2);
  font-size:1.5rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .13s,background .13s,box-shadow .13s}
.btn:hover{background:var(--s3)}
.btn:focus{background:var(--ring);color:var(--bg);transform:scale(1.05);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.3),0 1rem 2.4rem rgba(0,0,0,.6)}
.btn.pri{background:var(--red)}
.btn.pri:focus{background:var(--ring)}

/* ============ TOAST ============ */
#toast{position:fixed;left:50%;bottom:4rem;transform:translate(-50%,2rem);z-index:60;
  padding:1.4rem 2.8rem;border-radius:999px;background:var(--tx);color:var(--bg);
  font-size:1.35rem;font-weight:700;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;box-shadow:0 1rem 3rem rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ PLAYER ============ */
#pl{position:fixed;inset:0;background:#000;z-index:40;display:none;overflow:hidden}
#pl.show{display:block}
#fr{width:100%;height:100%;border:0;pointer-events:none;display:block}
#pclick{position:absolute;inset:0}
#pui{position:absolute;inset:0;opacity:0;transition:opacity .22s;pointer-events:none}
#pui.show{opacity:1}
#pui.show #ptop,#pui.show #pbot{pointer-events:auto}
#ptop{position:absolute;top:0;left:0;right:0;padding:2rem 2.8rem 9rem;
  background:linear-gradient(rgba(0,0,0,.85),transparent);
  display:flex;gap:1.6rem;align-items:flex-start}
#pt b{display:block;font-size:2.4rem;font-weight:600;line-height:1.3;margin-top:.6rem;
  text-shadow:0 .2rem .8rem rgba(0,0,0,.6)}
#pt span{color:#bbb;font-size:1.5rem;text-shadow:0 .1rem .4rem rgba(0,0,0,.6)}
#pbot{position:absolute;bottom:0;left:0;right:0;padding:10rem 2.8rem 1.8rem;
  background:linear-gradient(transparent,rgba(0,0,0,.9))}
#seek{height:3rem;display:flex;align-items:center;cursor:pointer;margin:0 1rem;border-radius:1.6rem}
.trk{position:relative;width:100%;height:.55rem;background:rgba(255,255,255,.35);border-radius:9px;
  transition:height .14s}
#seek:hover .trk,#seek:focus .trk,#seek.drag .trk{height:.9rem}
#pbuf,#pg{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px}
#pbuf{background:rgba(255,255,255,.45)}
#pg{background:var(--red)}
#knob{position:absolute;top:50%;left:0;width:2.2rem;height:2.2rem;margin:-1.1rem 0 0 -1.1rem;
  border-radius:50%;background:var(--red);transform:scale(0);transition:transform .14s;
  box-shadow:0 .2rem .8rem rgba(0,0,0,.5)}
#seek:hover #knob,#seek:focus #knob,#seek.drag #knob{transform:scale(1)}
#prow{display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
.pbtn{min-width:6rem;height:6rem;border-radius:99px;display:flex;align-items:center;justify-content:center;
  position:relative;flex:none;padding:0 1rem;font-size:1.55rem;font-weight:600;color:#fff;
  transition:background .12s,color .12s,transform .12s}
.pbtn svg{width:3.6rem;height:3.6rem}
.pbtn:hover{background:rgba(255,255,255,.18)}
.pbtn:focus{background:var(--ring);color:#000;transform:scale(1.08);
  box-shadow:0 0 0 .4rem rgba(255,255,255,.3),0 1rem 2.4rem rgba(0,0,0,.6)}
.pbtn .n{position:absolute;font-size:1.05rem;font-weight:800;top:50%;left:50%;transform:translate(-50%,-30%)}
.pbtn.on::after{content:'';position:absolute;bottom:.6rem;left:30%;right:30%;height:.3rem;
  background:var(--red);border-radius:2px}
#ptm{font-size:1.55rem;margin-left:1.6rem;font-variant-numeric:tabular-nums;color:#eee;white-space:nowrap;
  font-weight:500;text-shadow:0 .1rem .4rem rgba(0,0,0,.6)}
#ptm i{font-style:normal;color:#999}
.sp{flex:1}
#pcen{position:absolute;left:50%;top:50%;width:13rem;height:13rem;margin:-6.5rem;border-radius:50%;
  background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;
  pointer-events:none;backdrop-filter:blur(8px)}
#pcen svg{width:7rem;height:7rem;color:#fff}
#pl.paused #pcen{display:flex}

/* ============ SETTINGS-DESIGN (dunkel) – Orbs, Pills, Federn-Fokus, Fades ============ */
:root{--bg:#0b1118;--bg-elev:rgba(14,20,28,.84);--pill:rgba(255,255,255,.08);--pill2:rgba(255,255,255,.2);
  --s1:rgba(255,255,255,.08);--s2:rgba(255,255,255,.1);--s3:rgba(255,255,255,.18);
  --ac:#7db4f0;--ring:rgba(255,255,255,.88);--spr:cubic-bezier(.34,1.56,.64,1);--rd:#e5373d;
  --fk:0 1.6vh 4vh rgba(0,0,0,.55),0 0 0 .35vh var(--ring)}
@property --mt{syntax:'<length>';inherits:false;initial-value:0px}
html{background:var(--bg)}
body{background:radial-gradient(60% 70% at 15% 20%,#16324a 0,transparent 60%),radial-gradient(55% 60% at 85% 15%,#1b2a5a 0,transparent 60%),radial-gradient(60% 70% at 30% 95%,#0f3b3b 0,transparent 60%),linear-gradient(160deg,#0b1118,#0e141c 55%,#0a1216);animation:fdIn .7s ease}
body::before,body::after{content:"";position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(9vw);opacity:.28;pointer-events:none;z-index:0;animation:drift 16s ease-in-out infinite alternate}
body::before{background:#1c6aa0;left:-18vw;top:-24vw}
body::after{background:#2c3fa8;right:-22vw;bottom:-30vw;animation-duration:22s;animation-delay:-7s}
@keyframes drift{to{transform:translate(14vw,9vw) scale(1.18)}}
@keyframes fdIn{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(2.4vh) scale(.96)}}
@keyframes nudge{to{transform:translateX(.5vh)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}

/* Sidebar */
#nav{background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(2.4rem);backdrop-filter:blur(2.4rem);border-right:1px solid rgba(255,255,255,.08);
  transition:width .4s cubic-bezier(.32,.72,0,1),background .3s,box-shadow .3s}
#nav:focus-within{background:var(--bg-elev);box-shadow:1rem 0 5rem rgba(0,0,0,.6)}
.nv{border-radius:99px;background:var(--pill);color:#f2f2f2;transition:transform .28s var(--spr),background .2s,box-shadow .25s,color .2s}
.nv:hover{background:var(--s3)}
.nv.active{background:var(--pill2)}.nv.active svg{color:var(--ac)}
.nv:focus{background:var(--pill2);color:#fff;transform:scale(1.045);box-shadow:var(--fk)}
.nv:focus svg{color:#fff;animation:nudge .6s ease-in-out infinite alternate}
.nv:active,.chip:active,.btn:active,.key:active,.card:active{transform:scale(.975);transition-duration:.08s}
#nav:focus-within~#content{opacity:.4}

/* Inhalt */
#content{z-index:1;--mt:0px;transition:opacity .35s}
#content.fi{animation:fdIn .45s ease}
#content.fade{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--mt),#000 calc(100% - 8vh),transparent);mask-image:linear-gradient(to bottom,transparent 0,#000 var(--mt),#000 calc(100% - 8vh),transparent);transition:opacity .35s,--mt .25s}
h2{color:var(--ac);font-size:3rem;font-weight:700}
.grid .card,.res>*,.channel,.chip,.nv,.key,.chback,.chhead,.msg{animation:up .5s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i,0)*38ms)}
.key{animation-delay:calc(var(--i,0)*12ms)}

/* Chips */
.chip{background:var(--pill);border-radius:99px;-webkit-backdrop-filter:blur(1rem);backdrop-filter:blur(1rem);transition:transform .28s var(--spr),background .2s,box-shadow .25s,color .2s}
.chip.on{background:rgba(125,180,240,.28);color:#fff;box-shadow:inset 0 0 0 .2rem rgba(125,180,240,.75)}
.chip:focus{background:var(--pill2);color:#fff;transform:scale(1.07);box-shadow:var(--fk)}

/* Karten */
.card{transition:transform .28s var(--spr)}
.th{border-radius:2rem;border:1px solid rgba(255,255,255,.06)}
.card:focus .th{box-shadow:var(--fk)}
.res .card{border-radius:2.6rem}.res .card .th{border-radius:1.8rem}
.res .card:focus{background:var(--pill2);box-shadow:var(--fk)}
.res{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 6vh),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 6vh),transparent)}
.b{border-radius:99px;padding:.2rem 1rem}

/* Kanäle */
.channels{gap:.8rem}
.channel{background:var(--pill);border-radius:3.6rem;color:#f2f2f2;transition:transform .28s var(--spr),background .2s,box-shadow .25s}
.channel:focus{background:var(--pill2);color:#fff;transform:scale(1.03);box-shadow:var(--fk)}
.channel:focus span{color:rgba(255,255,255,.72)}
.chback{background:var(--pill);transition:transform .28s var(--spr),background .2s,box-shadow .25s}
.chback:focus{background:var(--pill2);color:#fff;transform:scale(1.06);box-shadow:var(--fk)}

/* Suche, Tasten, Buttons */
.qb{background:var(--pill);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(1rem);backdrop-filter:blur(1rem)}
.caret{background:var(--ac)}
.key{background:var(--pill);border-radius:1.6rem;transition:transform .28s var(--spr),background .2s,box-shadow .25s}
.key:focus{background:var(--pill2);color:#fff;transform:scale(1.12);box-shadow:var(--fk)}
.key.go,.btn.pri{background:rgba(229,55,61,.9)}
.key.go:focus,.btn.pri:focus{background:#ff4a50;color:#fff}
.btn{background:var(--pill);transition:transform .28s var(--spr),background .2s,box-shadow .25s}
.btn:focus{background:var(--pill2);color:#fff;transform:scale(1.05);box-shadow:var(--fk)}
#toast{background:rgba(30,40,55,.85);color:#fff;border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(1.6rem);backdrop-filter:blur(1.6rem);transition:opacity .3s,transform .45s var(--spr)}

/* Player */
#pl.show{animation:fdIn .4s ease}
#pui{transition:opacity .4s}
#pbot{background:linear-gradient(transparent,rgba(5,9,14,.92))}
.pbtn{transition:transform .28s var(--spr),background .2s,box-shadow .25s,color .2s}
.pbtn:focus{background:var(--pill2);color:#fff;transform:scale(1.1);box-shadow:0 1.4vh 3.6vh rgba(0,0,0,.6),0 0 0 .3vh var(--ring)}
#pl.paused #pcen{animation:pop .35s cubic-bezier(.2,.9,.2,1)}
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="content" class="sc"></div>
<div id="pl"><iframe id="fr" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin" tabindex="-1"></iframe>
  <div id="pclick"></div><div id="pcen"></div>
  <div id="pui">
    <div id="ptop"><button id="pback" class="pbtn" type="button" data-f="true" aria-label="Zurück"></button><div id="pt"></div></div>
    <div id="pbot">
      <div id="seek" tabindex="0" data-f="true"><div class="trk"><div id="pbuf"></div><div id="pg"></div><b id="knob"></b></div></div>
      <div id="prow">
        <button id="pplay" class="pbtn" type="button" data-f="true" aria-label="Wiedergabe"></button>
        <button id="pprev" class="pbtn" type="button" data-f="true" aria-label="10 Sekunden zurück"></button>
        <button id="pnext" class="pbtn" type="button" data-f="true" aria-label="10 Sekunden vor"></button>
        <button id="pvol" class="pbtn" type="button" data-f="true" aria-label="Ton"></button>
        <div id="ptm"><span id="p1">0:00</span> <i>/</i> <span id="p2">0:00</span></div>
        <div class="sp"></div>
        <button id="pspd" class="pbtn" type="button" data-f="true" aria-label="Geschwindigkeit">1×</button>
        <button id="pcapt" class="pbtn" type="button" data-f="true" aria-label="Untertitel"></button>
      </div>

(() => { const sk = $('#seek'), fr = e => { const r = sk.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  sk.addEventListener('pointerdown', e => { PL.drag = true; sk.classList.add('drag'); try { sk.setPointerCapture(e.pointerId); } catch {} PL.cur = fr(e) * PL.dur; upd(); });
  sk.addEventListener('pointermove', e => { if (PL.drag) { PL.cur = fr(e) * PL.dur; upd(); } });
  const end = e => { if (!PL.drag) return; PL.drag = false; sk.classList.remove('drag'); PL.cur = fr(e) * PL.dur; cmd('seekTo', [PL.cur, true]); upd(); showBar(); };
  sk.addEventListener('pointerup', end); sk.addEventListener('pointercancel', () => { PL.drag = false; sk.classList.remove('drag'); }); })();
const prow = () => [[$('#pback')], [$('#seek')], $$('#prow .pbtn')];
function pmove(dir, a) {
  const R = prow(), r = R.findIndex(x => x.includes(a));
  if (r < 0) return focusEl($('#pplay'));
  const i = R[r].indexOf(a);
  if (dir === 'left' || dir === 'right') { if (r === 1) return seek(dir === 'right' ? 10 : -10); const n = R[r][i + (dir === 'right' ? 1 : -1)]; if (n) focusEl(n); }
  else { const nr = r + (dir === 'down' ? 1 : -1); if (R[nr]) focusEl(R[nr][0]); }
  showBar();
}
function playerKey(ev) {
  const k = ev.key, c = ev.keyCode, a = document.activeElement, inUI = uiShown() && a && $('#pl').contains(a) && a.matches('[data-f]');
  if (k === 'GoBack' || k === 'BrowserBack' || k === 'Escape' || k === 'Backspace' || k === 'MediaStop' || [461, 10009, 27, 8, 413].includes(c)) { ev.preventDefault(); return closePl(); }
  if (k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || [179, 10252, 415, 19].includes(c)) { ev.preventDefault(); return toggle(); }
  if (k === 'MediaFastForward' || c === 417) { ev.preventDefault(); return seek(10); }
  if (k === 'MediaRewind' || c === 412) { ev.preventDefault(); return seek(-10); }
  if (k === 'Enter' || k === ' ' || c === 13 || c === 32) { ev.preventDefault(); if (inUI && a.id !== 'seek') return a.click(); return toggle(); }

  if (!dir) return; ev.preventDefault();
  if (inUI) return pmove(dir, a);
  if (dir === 'left') return seek(-10); if (dir === 'right') return seek(10);
  showBar(); focusEl($('#pplay'));
}

/* ===== NACHRICHTEN ===== */
window.addEventListener('message', ev => {
  const d = ev.data;
  if (typeof d === 'string' && /youtube/.test(ev.origin)) {
    try { const j = JSON.parse(d);
      if (j.event === 'infoDelivery' && j.info) {
        const i = j.info;
        if (i.currentTime != null && !PL.drag) PL.cur = i.currentTime;
        if (i.duration) PL.dur = i.duration;
        if (i.playerState != null) PL.st = i.playerState;
        if (i.videoLoadedFraction != null) PL.buf = i.videoLoadedFraction;
        if (i.muted != null) PL.muted = !!i.muted;
        if (i.playbackRate) PL.rate = i.playbackRate;
        upd(); if (i.playerState === 2) showBar();
      }
      else if (j.event === 'onError') toast('Dieses Video lässt sich hier nicht abspielen');
      else if (j.event === 'onReady' || j.event === 'onApiChange') killCaptions();
    } catch {} return;
  }
  if (!d || d.type !== 'mp-key') return;
  if (d.key === 'Enter' || d.keyCode === 13 || d.key === ' ') { const a = document.activeElement; if (!S.playing && a && a !== document.body && a.click) { a.click(); return; } }
  document.dispatchEvent(new KeyboardEvent('keydown', { key:d.key, keyCode:d.keyCode, which:d.keyCode, bubbles:true, cancelable:true }));
});

/* ===== FERNBEDIENUNG ===== */
function vis(el) {
  if (!el || el.disabled || el.hidden) return false;
  if (el.closest('[hidden]')) return false;
  const r = el.getBoundingClientRect();
  return r.width >= 4 && r.height >= 4;
}
function focusEl(el) {
  if (!el) return;
  el.focus({ preventScroll:true });
  el.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
}
const initial = () => $('#nav .nv.active') || $('#nav .nv');
function move(dir) {
  let cur = document.activeElement; if (!cur || !cur.matches || !cur.matches('[data-f]')) cur = null;
  if (!cur) return focusEl(S.last && S.last.isConnected && vis(S.last) ? S.last : initial());
  const all = $$('[data-f]').filter(e => e !== cur && vis(e));
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2, hz = dir === 'left' || dir === 'right';
  if (hz || S.colFor !== cur) S.col = null; if (!hz && S.col == null) S.col = cx; const colX = S.col == null ? cx : S.col;
  let best = null, bs = Infinity;
  for (const strict of [true, false]) {
    for (const el of all) {
      const r = el.getBoundingClientRect(), ex = r.left + r.width / 2, ey = r.top + r.height / 2; let prim, gap, off;
      if (hz) { if (dir === 'right' ? ex <= cx + 1 : ex >= cx - 1) continue; prim = dir === 'right' ? r.left - c.right : c.left - r.right; gap = Math.max(0, r.top - c.bottom, c.top - r.bottom); if (strict && gap > 8) continue; off = Math.abs(ey - cy); }
      else { if (dir === 'down' ? ey <= cy + 1 : ey >= cy - 1) continue; prim = dir === 'down' ? r.top - c.bottom : c.top - r.bottom; gap = Math.max(0, r.left - c.right, c.left - r.right); off = Math.abs(ex - colX); }
      const sc = Math.max(0, prim) + gap * 3 + off * .5 + (!hz && gap > 0 ? 1000 : 0); if (sc < bs) { bs = sc; best = el; }
    }
    if (best) break;
  }
  if (best) { S.colFor = best; focusEl(best); }
}
function goBack() { const a = document.activeElement; if (a && a.matches && a.matches('[data-f]') && !a.matches('#nav .nv')) { focusEl(initial()); return true; } return false; }
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (S.playing) return playerKey(ev);
  const k = ev.key, c = ev.keyCode;
  if (k === 'Enter' || c === 13 || k === ' ') { const a = document.activeElement; if (a && a !== document.body && a.matches && a.matches('button,[data-f],[tabindex],a[href],input,select,[role=button]') && a.click) { ev.preventDefault(); a.click(); return; } }
  if (S.tgt && k === 'Backspace' && S.tgt.get()) { ev.preventDefault(); S.tgt.set(S.tgt.get().slice(0, -1)); return; }
  if (k === 'GoBack' || k === 'BrowserBack' || c === 461 || c === 10009 || k === 'Escape' || k === 'Backspace') {
    if (S.chanBack) { ev.preventDefault(); return backFromChannel(); }
    if (goBack()) ev.preventDefault(); else { try { parent.postMessage({ type:'mp-app-exit' }, '*'); } catch {} }
    return;
  }
  if (S.tgt && k.length === 1 && /[\p{L}\p{N}\-.:\/_@?=]/u.test(k)) { ev.preventDefault(); S.tgt.set(S.tgt.get() + k.toLowerCase()); return; }
  const dir = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' }[k] || ({ 37:'left', 38:'up', 39:'right', 40:'down' })[c];
  if (dir) { ev.preventDefault(); return move(dir); }
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('[data-f]') && !e.target.matches('#nav .nv')) S.last = e.target; });
['contextmenu','dragstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
(() => { const w = () => { ['pointerdown','keydown','click'].forEach(t => document.removeEventListener(t, w, true)); try { const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn && !document.fullscreenElement) Promise.resolve(fn.call(el)).catch(() => {}); } catch {} }; ['pointerdown','keydown','click'].forEach(t => document.addEventListener(t, w, true)); })();

setTab('home'); focusEl($('.chip.on') || $('.chip') || initial());
})();

(() => {
  const SYS = /^(AudioVolume(Up|Down|Mute)|Volume(Up|Down|Mute)|VoiceAssist|LaunchAssistant|Assistant|VoiceDial|Settings|Menu|ContextMenu|Info|Help)$/;
  const SYSC = [173,174,175,447,448,449,231,93,82,457];
  ['keydown','keyup','keypress'].forEach(t => window.addEventListener(t, ev => {

    if (t === 'keydown' && (ev.key === 'BrowserSearch' || ev.key === 'Search' || ev.keyCode === 170)) { ev.preventDefault(); ev.stopImmediatePropagation(); try { parent.postMessage({ type:'mp-app-search' }, '*'); } catch {} }
  }, true));
