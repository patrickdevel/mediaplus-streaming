<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube</title>
<style>
:root{--bg:#0f0f0f;--tx:#f1f1f1;--t2:#aaa;--s:#272727;--s2:#3f3f3f;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:400 14px/1.4 Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;outline:0;border:0}
svg{fill:currentColor;width:24px;height:24px;flex:none}
.flip{transform:scale(-1,-1)}
::-webkit-scrollbar{display:none}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:rgba(255,255,255,.12)}

#top{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--bg);padding-top:var(--sa);transition:transform .3s cubic-bezier(.22,.8,.2,1)}
#top.hide{transform:translateY(-110%)}
#hd{height:56px;display:flex;align-items:center;padding:0 4px 0 12px}
.logo{display:flex;align-items:center;gap:3px;flex:1}
.logo svg{width:30px;height:21px}
.logo b{font:700 22px/1 Roboto,Arial,sans-serif;letter-spacing:-.07em}
#tabs{display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;height:48px;align-items:center}
.tb{height:36px;padding:0 14px;border-radius:14px;font-size:16px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.tb.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.08)}
body[data-tab=you] #tabs{display:none}
#main{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--sa) + 104px) 0 calc(64px + var(--sb))}
body[data-tab=you] #main{padding-top:calc(var(--sa) + 56px)}
body.m #main{padding-bottom:calc(170px + var(--sb))}

/* Tab-Wechsel: leichte Swipe-Animation */
#main.tab-in > *{animation:tabIn .24s cubic-bezier(.22,.8,.2,1) both}
@keyframes tabIn{from{opacity:0;transform:translateX(18px)}}

#bn{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(56px + var(--sb));padding-bottom:var(--sb);display:flex;background:rgba(15,15,15,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .3s cubic-bezier(.22,.8,.2,1)}
#bn button{flex:1;display:flex;align-items:center;justify-content:center}
#bn svg{width:28px;height:28px;transition:width .22s,height .22s}
#bn.compact{height:calc(46px + var(--sb));background:rgba(15,15,15,.72)}
#bn.compact svg{width:21px;height:21px}
#bn.hide{transform:translateY(110%)}
.me-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6a5a4a,#222);display:flex;align-items:center;justify-content:center;transition:width .22s,height .22s}
.me-av svg{width:18px;height:18px;color:#aaa}
#bn.compact .me-av{width:22px;height:22px}
#bn.compact .me-av svg{width:14px;height:14px}
#bn .on .me-av{box-shadow:0 0 0 2px #0f0f0f,0 0 0 3.5px #fff}

/* Karten */
.vc{display:block;cursor:pointer;margin-bottom:18px}
.th{position:relative;aspect-ratio:16/9;background:var(--s);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);border-radius:6px;padding:1px 5px;font-size:12px;font-weight:500;font-style:normal;line-height:18px}
.dur.live{background:#e00}
.pb{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
.pb i{display:block;height:100%;background:#f00}
.vm{display:flex;gap:12px;padding:12px 4px 0 12px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;overflow:hidden;background:var(--s2)}
.av img{width:100%;height:100%;object-fit:cover}
.tx{flex:1;min-width:0}
.ti{font-size:16px;line-height:22px;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{font-size:12px;line-height:18px;color:var(--t2);margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.mt svg{width:12px;height:12px;margin-right:-3px}
.vm .ib{margin-top:-8px;margin-right:0;width:36px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:0 12px}
.shelf .vc{flex:none;width:180px;margin:0}
.shelf .th{border-radius:12px}
.shelf .vm{padding:8px 0 0}.shelf .ti{font-size:14px;line-height:19px}
.shelf .vm .ib{margin-right:-10px}
.sk .th{animation:pu 1.1s ease-in-out infinite alternate}
.sk .ln{height:14px;border-radius:7px;background:var(--s);margin:12px 12px 0}
@keyframes pu{to{background:var(--s2)}}
.msg{color:var(--t2);padding:32px 16px;font-size:14px;line-height:1.6}
.pill{height:36px;padding:0 16px;border-radius:18px;background:rgba(255,255,255,.1);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.w{background:#f1f1f1;color:#0f0f0f}

/* Abos */
.stories{display:flex;gap:12px;padding:4px 12px 14px;overflow-x:auto;align-items:flex-start}
.st{flex:none;width:72px;text-align:center;font-size:12px}
.st .av{width:64px;height:64px;margin:0 auto 6px;font-size:24px}
.st span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.all{color:#3ea6ff;font-size:14px;font-weight:500;align-self:center;padding:0 4px 18px 8px;flex:none}

/* Du */
.you{display:flex;gap:16px;align-items:center;padding:8px 16px 20px}
.you .av{width:72px;height:72px}.you .av svg{width:44px;height:44px;color:#aaa}
.you b{display:block;font-size:24px;font-weight:700}.you span{color:var(--t2)}
.sec{display:flex;align-items:center;gap:4px;padding:6px 16px 12px;font-size:20px;font-weight:700}
.sec svg{width:22px;height:22px}
.lib{display:flex;gap:14px;align-items:center;width:100%;padding:8px 12px}
.lib .lt{width:112px;aspect-ratio:16/9;border-radius:10px;background:var(--s);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.lib .lt img{width:100%;height:100%;object-fit:cover}
.lib b{display:block;font-size:16px;font-weight:500}.lib span{color:var(--t2);font-size:13px}

/* Seiten */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sa);transform:translateX(0);transition:transform .28s cubic-bezier(.22,.8,.2,1);will-change:transform;touch-action:pan-y}
.page.page-under{transform:translateX(-24%);pointer-events:none}
.page.page-enter{transform:translateX(100%)}
.page.page-enter-active{transform:translateX(0)}
.page.page-leave{transform:translateX(100%);pointer-events:none}
.ph{height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;flex:none}
.ph h1{font-size:18px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgb{flex:1;overflow-y:auto;padding-bottom:calc(24px + var(--sb))}
.qi{flex:1;height:40px;border-radius:20px;background:var(--s);padding:0 16px;font-size:16px;min-width:0}
.qr{display:flex;align-items:center;gap:16px;width:100%;height:48px;padding:0 16px;font-size:16px}
.qr svg{color:#aaa}
.ch{display:flex;gap:16px;align-items:center;width:100%;padding:10px 16px}
.ch .av{width:72px;height:72px;font-size:28px}
.ch b{display:block;font-size:16px;font-weight:500}.ch span{display:block;color:var(--t2);font-size:12px;line-height:18px}
.chh{display:flex;gap:16px;padding:12px 16px 16px;align-items:center}
.chh .av{width:80px;height:80px;font-size:32px}
.chh h2{font-size:22px;font-weight:700}
.chh p{color:var(--t2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 10px}

/* Player */
#pl{position:fixed;z-index:60;background:#000;display:none;padding-top:var(--sa);touch-action:manipulation;will-change:transform,opacity}
#pv{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;transform-origin:top left}
#fr{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none !important;background:#000}
#pt{position:absolute;inset:0;z-index:1}
#pc{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.5)}
#pc.on{opacity:1}#pc.on button{pointer-events:auto}
#pc .cb{position:absolute;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#pmin{left:4px;top:4px}#pfs{right:4px;bottom:20px}
#cg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:34px}
#cg .cb{position:static;width:56px;height:56px}#bp svg{width:44px;height:44px}
.sk10{position:relative}.sk10 svg{width:32px;height:32px}.sk10 em{position:absolute;font:700 9px/1 Roboto,Arial;font-style:normal;top:50%;left:50%;transform:translate(-50%,-35%)}
#tm{position:absolute;left:12px;bottom:26px;font-size:12px;font-weight:500}
#sk{position:absolute;left:0;right:0;bottom:0;height:26px;z-index:3;touch-action:none}
#sk .trk{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
#sk #bf{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.35)}
#sk #sg{position:absolute;inset:0 auto 0 0;background:#f00}
#kn{position:absolute;bottom:-4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f00;opacity:0;transition:opacity .15s}
#pc.on~#sk #kn,#sk.drag #kn{opacity:1}
#sk.drag .trk{height:5px}
.mc{display:none}
#wi{display:none;position:fixed;left:0;right:0;bottom:0;top:calc(56.25vw + var(--sa));z-index:55;background:var(--bg);overflow-y:auto;padding-bottom:var(--sb)}
body.w #pl{display:block;top:0;left:0;width:100%}
body.w #wi{display:block}
body.w #bn,body.w #top{visibility:hidden}
body{--mb:calc(66px + var(--sb));--mt:calc(var(--sa) + 104px)}
body[data-tab=you]{--mt:calc(var(--sa) + 56px)}
body.nh{--mb:calc(10px + var(--sb));--mt:calc(var(--sa) + 6px)}
body.m #pl{display:block;right:10px;left:auto;bottom:var(--mb);top:auto;width:min(200px,50vw);padding:0;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.7);z-index:70;overflow:visible;touch-action:none;transition:bottom .3s cubic-bezier(.22,.8,.2,1),top .3s cubic-bezier(.22,.8,.2,1),transform .3s cubic-bezier(.22,.8,.2,1)}
body.m.ml #pl{left:10px;right:auto}
body.m.mt #pl{top:calc(var(--mt) + 6px);bottom:auto}
body.m.mo #pl{transform:translateX(calc(100% + 10px))}
body.m.mo.ml #pl{transform:translateX(calc(-100% - 10px))}
body.m #pl.drag{transition:none !important}
#mh{display:none;position:absolute;top:50%;margin-top:-26px;width:26px;height:52px;background:rgba(30,30,30,.92);color:#fff;align-items:center;justify-content:center;z-index:5;pointer-events:auto;left:-26px;border-radius:12px 0 0 12px}
body.m.ml #mh{left:auto;right:-26px;border-radius:0 12px 12px 0}
body.m.mo #mh{display:flex}
body.m.ml #mh svg{transform:scaleX(-1)}
#mh svg{width:20px;height:20px}
body.m #pv{border-radius:12px}
body.m .mc{display:flex}body.m #pc,body.m #cg,body.m #tm,body.m .fc{display:none}
body.m #sk{height:3px;pointer-events:none}
body.m #fr{pointer-events:none !important}
body.m #pt{pointer-events:auto !important;touch-action:none}
body.m #pv{pointer-events:none}
body.m #mpp,body.m #mx{pointer-events:auto !important}
#mpp{position:absolute;left:4px;top:4px;z-index:4;width:38px;height:38px;align-items:center;justify-content:center}
#mpp svg{width:28px;height:28px}
#mx{position:absolute;right:4px;top:4px;z-index:4;width:38px;height:38px;align-items:center;justify-content:center}
#pl:fullscreen{padding:0;display:flex;align-items:center;background:#000}
#pl:fullscreen #pv{height:100%;aspect-ratio:auto}
#pl:-webkit-full-screen{padding:0;display:flex;align-items:center}
#pl:-webkit-full-screen #pv{height:100%;aspect-ratio:auto}

#wt{padding:12px 12px 0}
#wt h1{font-size:18px;line-height:24px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#wt .mt{font-size:13px;margin-top:2px}#wt .mt b{color:var(--tx);font-weight:500}.mo{color:var(--tx);font-weight:500}
.wa{display:flex;align-items:center;gap:12px;padding:14px 12px 4px}
.wa .nm{flex:1;min-width:0}.wa .nm b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wa .nm span{font-size:12px;color:var(--t2)}
.acts{display:flex;justify-content:space-between;padding:6px 8px 10px;max-width:420px}
.acts .ib.on{color:#3ea6ff}
.chips{display:flex;gap:8px;padding:6px 12px 14px;overflow-x:auto;border-bottom:1px solid #222}
.chip{height:32px;padding:0 12px;border-radius:8px;background:var(--s);font-weight:500;white-space:nowrap;flex:none}
.chip.on{background:#f1f1f1;color:#0f0f0f}
#rl{padding-top:16px}
#rl .vc{margin-bottom:18px}

#sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0);transition:background .2s;display:flex;align-items:flex-end;justify-content:center}
#sheet.in{background:rgba(0,0,0,.6)}
.sp{width:100%;max-width:560px;max-height:80%;overflow-y:auto;background:#212121;border-radius:14px 14px 0 0;padding:8px 0 calc(12px + var(--sb));transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#sheet.in .sp{transform:none}
.grab{display:block;width:36px;height:4px;border-radius:2px;background:#5a5a5a;margin:4px auto 10px}
.si{display:flex;align-items:center;gap:20px;width:100%;height:52px;padding:0 20px;font-size:16px}
.si:active{background:#3a3a3a}
.dsc{padding:4px 16px 16px}
.dsc h2{font-size:20px;font-weight:700;line-height:26px}
.dsc .stt{display:flex;gap:28px;margin:18px 0;text-align:center}.dsc .stt b{display:block;font-size:20px}.dsc .stt span{font-size:12px;color:var(--t2)}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sb));transform:translate(-50%,20px);background:#f1f1f1;color:#0f0f0f;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
